# Tooling config only -- this project is NOT pip-installable (the mod ships as a
# packaged .wotmod, see build/build_wotmod.py). No [project]/[build-system] table on
# purpose. Test/lint tooling runs on Python 3.13; the mod source stays 2.7-compatible.

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/conftest.py puts src/res/scripts/client on sys.path so the engine-free
# domain imports without the game engine.

[tool.ruff]
# py37 is ruff's floor; the shipped source must remain Python 2.7-compatible, so the
# lint set below deliberately excludes any py3-only / upgrade rules (no UP/pyupgrade).
target-version = "py37"
line-length = 100
# The probe*.py scratch scripts are dev-only REPL snippets that reference the
# REPL-injected `echo` helper (F821) and never ship. The per-mod debug REPL server
# itself has been retired in favour of the harness-owned debug REPL (see
# wotmod-harness/plugins/wotmod/tools/debug-repl/).
extend-exclude = ["tools/dev/probe*.py"]

[tool.ruff.lint]
# Intentionally minimal -- high-signal, no-reformat rules only. E9 = syntax errors,
# F = pyflakes (unused/misplaced imports, unused vars, undefined names). PGH004 bans a
# bare `# noqa` (every suppression must name its rule), RUF100 flags a `# noqa` that no
# longer suppresses anything. This formalizes the existing `# noqa: F401` markers
# without churning formatting.
select = ["E9", "F", "PGH004", "RUF100"]
