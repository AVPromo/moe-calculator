<!DOCTYPE html>
<!-- icon_gap_tuner.html -- HAND-AUTHORED, self-contained dev tuner for the per-icon INK GAP of
     the four in-battle bar compositions (Moving Average / Damage Efficiency, each horizontal +
     vertical). NOT shipped.

     2026-08-09 REBUILT ON THE REAL SHEETS: every previous pass (h-tick, rowPct, WRAP/TRACK_*/
     TICK_*, the .tv-* stand-in elements, applyCap's cap descriptors) was this tool re-deriving
     the shipped bars' geometry from hand-transcribed constants -- and every one of those passes
     found a fresh transcription error, because re-deriving is where the errors kept coming from,
     not the ink-gap math itself. Per the maintainer ("just copy existing bar's styles already"),
     that whole model is gone. What replaces it:
       - MoEProgress.css, MoEProgressVertical.css, MoEEfficiency.css, MoEEfficiencyVertical.css
         are inlined BYTE-FOR-BYTE below (see tools/dev -- pulled via a one-off Node script that
         read the real files and JSON-embedded them; nothing in these four blocks was retyped).
       - The real MARKUP / V_MARKUP strings from MoEProgress.js and MoEEfficiency.js are
         inlined the same way, verbatim, so the DOM the copied CSS selects against is the DOM it
         was written for.
       - box / background-size / gap-lever / Y-nudge are read OUT of the copied CSS text at
         load time (see extractIcon() below), via the exact same technique that verified them
         against source before this rewrite -- never a number typed into a JS constant by hand.
         Editing the copied CSS text and reloading changes what the tool reads, automatically.
       - Scoping: MA's sheets (.mp-*/.mpv-*) and DE's sheets (.mp-*/.mev-*) share the bare
         "mp-" namespace on their horizontal side BY DESIGN in the real game -- each ships to its
         own separate document/window, so they never collide there. This tool shows one bar at a
         time, so the inactive bar's two <style> elements are simply .disabled while the active
         bar's pair is enabled -- exactly the load/no-load switch the real client gets for free
         by never opening both windows at once. No selector was touched to make this work.
       - Orientation and size mode are driven the SAME way the game drives them: toggling
         "mpv"/"mev" and "mp-lg" on this document's own <body>, because that is the literal
         class MoEBarTransient.js adds to ITS document's <body> (confirmed at
         MoEBarTransient.js:393,839). The shipped .mp-lg/.mev-lg/.mpv-lg blocks in the copied
         CSS do the rest.
       - Neutralisation (added AFTER the four copies, in its own block, never edited into them):
         the bare-sibling @font-face (url(MoEBattle.ttf)) and every quest_type/marksOnGun
         background-image (url(img://...)) would 404 or be blocked outright under this artifact's
         CSP -- both get a data: URI override at higher specificity, the same base64 assets this
         tool has carried since the very first pass. #moe-bar-root's own opacity:0 (the real JS
         reveals it once the surface settles; nothing here runs that lifecycle) is forced to 1.
         The checker.png backdrop dither is turned off outright (background-image:none) -- purely
         decorative, irrelevant to an ink gap, not worth inlining a fifth asset for.
       - ONLY MARK ICONS RENDER, per the maintainer's explicit call ("leave only 1-3 mark icons...
         Others I don't need"): every static row (pre_avg/dmgp, proj_avg-or-current-damage/
         dmgc-or-dmg, battles, next-requirement/bm) is hidden via el.style.display="none" on the
         real element, found by its real class -- never by editing the markup string itself. The
         damage/proj_avg row's own numbers are still READ (same extraction, same hidden element)
         to drive the reference-gap badge; see the banner above the mark controls.
       - MA'S ONE REAL POSITION: MoEProgress.js's setIco() writes ONE cached element's className
         wholesale (mk/mk1/mk2/mk3) -- there is exactly one .mp-cap.side.mp-capR (horizontal) /
         .mpv-capR (vertical) DOM node in the real bar, not three. This tool cannot show three
         simultaneous real copies of it without either (a) three ids named #moe-bar-root in one
         document, illegal, or (b) iframes, which risk violating this artifact's CSP in a way
         this tool cannot test from here. So MA shows ONE real mark at a time, chosen by the
         radio group beside its controls; mark_1/mark_2/mark_3 each keep their own stored
         box/lever/Y independently even while not the one currently mounted -- switching back
         does not lose earlier tuning. DE's r1/r2/r3 are genuinely separate real DOM nodes at
         their own real percentages, so DE shows all three at once, for real, no compromise.
       - BROWSER-DEPENDENT PARTS NOT VERIFIABLE FROM HERE: no headless browser was available in
         the sandbox this was built in (no Chrome/Edge/Puppeteer/Playwright found). The stylesheet
         disabled-toggle, the body-class-driven .mp-lg/.mpv-lg/.mev-lg blocks, and the extraction
         regexes were all exercised in Node against the literal embedded CSS text (see the
         self-check inline in the page's script block), which proves the TEXT and the NUMBERS are right, but NOT that a
         real browser lays the composition out as intended. Open this file in an actual browser
         before trusting it further.

     SELF-CONTAINED: the two PNG families (quest_type barrel_mark/damage, marksOnGun mark_1-3)
     and the MoEBattle.ttf font are inlined as base64 data: URIs (carried over unchanged from the
     prior pass -- not re-extracted, since they were never the source of any bug this thread
     found). No img://, no coui://, no <link>, no external request, no :not(). -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>MoE battle bars -- icon-gap tuner (real sheets)</title>
<style id="css-mp" disabled>
/* MoEProgress.css -- in-battle centre-screen MoE progress bar. Tuned in the browser
   (tools/dev/gen_bar_tuner.ps1) and copied VERBATIM; the battle window has no hot-reload.
   Position comes from Python (window.move()), NOT from CSS -- tuner stage placement was
   top 85vh, centre offset 0rem. Font: the bundled MoEBattle numeric subset,
   19 glyphs (digits % ( ) + - , . / space) -- NO LETTERS, a word label renders blank.
   Sizes in rem (1rem == 1 logical px); colours by VALUE (Gameface drops a declaration
   whose var() cannot resolve). JS sets .mp-fill width and the .mp-proj / .mp-capC left as
   percentages, and toggles .mp-up/.mp-down on the fill + the bottom numerals. The axis-end
   caption is pure CSS (it hangs off the track's right end), so JS measures nothing. */

/* ADDITION 1 OF 2 TO THE TUNER'S EMITTED FILE. #moe-bar-root asks for font-family "MoEBattle"
   but the tuner ran in a browser and never emitted a face for it, and this document does NOT
   <link> MoEBattle.css (that would drag the whole corner overlay's rules in with it). So the
   6-line declaration is copied verbatim from MoEBattle.css:23-29 -- same family name, same
   single weight-600 cut, same bare-sibling url FIRST: Coherent resolves an @font-face src
   against the DOCUMENT directory only, so a subdir-relative path silently falls back to Arial
   Narrow. That is also why this file must sit right beside MoEBattle.ttf and checker.png. */
@font-face {
    font-family: "MoEBattle";
    font-weight: 600;
    font-style: normal;
    src: url(MoEBattle.ttf) format("truetype"),
         url("coui://gui/gameface/mods/14th_ua/MoECalculator/MoEBattle.ttf") format("truetype");
}

/* ADDITION 2 OF 2 TO THE TUNER'S EMITTED FILE (not tuned, no tuned value touched) -- THE SIZING
   SHIM. #moe-bar-root is position:absolute and therefore contributes ZERO content size, so with an
   empty body the engine's size calculation has nothing to measure: it times out
   (`Size calculation timeout` for MoEProgressView) and its fallback action -- literally "Set the
   default view size" -- runs LAST and overwrites MoEProgress.js's pushed resizeViewRem size with
   the flat 256x256 default (live-observed: resize at 04.8s, clobber at 06.2s). #moe-bar-box
   (declared in MoEProgressView.html, NOT JS-created -- it must exist at the first layout pass)
   gives that pass in-flow content of exactly the surface size.
   IT DOES NOT STOP THE TIMEOUT -- RE-MEASURED LIVE, AND THIS COMMENT USED TO CLAIM OTHERWISE. The
   box is present, in-flow and exactly 380x92, and the `Size calculation timeout` + its 256x256
   clobber still happen. The ONLY thing that fixes the surface is MoEProgress.js's re-assert after
   that deadline (SURFACE_REASSERT_MS), which is therefore load-bearing and not deletable; the JS
   also refuses to show the bar until it has landed (surfaceSettled), because a 256x256 surface
   crops the composition and Python then places it ~142px too high. The box is kept regardless: it
   is the honest description of the document's size, it costs nothing, and it is not what is broken.
   body margin:0 matters: the UA's default 8px would inflate the measured box to 396x108. The box is
   an empty, transparent sizing shim; the abspos bar root overlays it and no tuned geometry moves.
   380 x 92 MIRRORS MoEProgress.js's VIEW_W_REM / VIEW_H_REM, which are the SOURCE OF TRUTH
   (BOX_W/H_REM + 2*PAD_REM). Same mirrored-constant contract as the JS's SHIFT_Y_REM <->
   Python's domain/constants.PROGRESS_ANCHOR_Y_SHIFT: change one, change all of them.
   tests/test_progress_surface_mirror.py fails if they drift. */
body { margin: 0; }
#moe-bar-box { width: 380rem; height: 92rem; }

#moe-bar-root {
  position: absolute;
  left: 0;
  top: 0;
  /* THE TRACK WIDTH, and the ONE number the whole composition is derived from. It must stay a
     width the dash grid can tile without a truncated GAP (see .mp-track::after: 2rem dash +
     1rem gap == a 3rem period): 200 == 3*66 + 2, i.e. 66 whole periods then a final full 2rem
     dash flush against the right edge. Any width == 0 or 2 (mod 3) is clean; a width == 1
     (mod 3) ends on a half gap and the grid reads irregular at the right end -- fix that by
     moving the WIDTH, never the tuned dash/gap/period. .mp-backdrop's width and
     MoEProgress.js's BOX_W_REM (hence #moe-bar-box above) are this + 2*80rem of side clearance;
     everything that MOVES is a percentage and follows for free. */
  width: 200rem;
  z-index: 9000;
  pointer-events: none;
  text-align: center;
  font-family: "MoEBattle", "Arial Narrow", sans-serif;
  opacity: 0;
}
/* Backdrop = the .mb-backdrop two-layer trick: checker dither over a dark radial underlay.
   EXPLICIT width+height with a single top/left anchor -- Coherent collapses a top+bottom
   stretch. checker.png + the ttf sit RIGHT BESIDE this CSS (bare sibling urls). */
.mp-backdrop {
  position: absolute;
  left: -80rem;
  top: -34rem;
  width: 360rem;
  height: 72rem;
  z-index: 0;
}
.mp-backdrop::before {
  content: "";
  position: absolute; left: 0; top: 0; width: 100%; height: 100%;
  background: url(checker.png) repeat;
  background-size: auto;
  background-position: 0px 0px;
  image-rendering: pixelated;
  opacity: 0.1;
  mask: radial-gradient(56% 110% at 50% 50%,#000 0%,transparent 67%);
}
.mp-backdrop::after {
  content: "";
  position: absolute; left: 0; top: 0; width: 100%; height: 100%;
  z-index: -1;
  background: radial-gradient(76% 57% at 50% 50%,rgba(0,0,0,0.35) 0%,rgba(0,0,0,0) 70%);
}
.mp-track {
  position: relative;
  z-index: 1;
  width: 100%;
  height: 3rem;
  background: rgba(0,0,0,0.45);
}
/* THE GARAGE BAR'S TRACK TREATMENT, cloned (MoECalculator.css:277-296 -- #moe-root .moe-track).
   The hangar bar gets its vertical dashes from WG's OWN art, a 99x2 strip drawn at
   background-size:99rem 2rem, i.e. 1 art px == 1rem -> 2rem dash + 1rem gap (3rem period),
   cream rgb(236,230,218) at alpha 41/255 = 0.16, repeat-x from the left edge. Same numbers
   here, re-drawn as a gradient because they are SLIDERS in the tuner (a fixed PNG cannot
   follow them) AND because the GAP needs a colour of its own (next paragraph).
   IF Coherent ever drops repeating-linear-gradient, the verified fallback is the garage's own
   line, which renders correctly in the hangar today:
       background-image: url(img://gui/maps/icons/ui/progressbar/bg_pattern_small.png);
       background-repeat: repeat-x; background-size: 99rem 2rem; background-position: left center;
   -- pixel-identical for the MARKS at 2 / 1 / #ece6da / 0.16, but that PNG's gaps are
   TRANSPARENT, so it is only equivalent at gap alpha 0. To keep the masked look on that
   fallback the fill itself would have to carry the pattern (which is literally what the
   hangar does -- see below).
   The garage's "border" is NOT a border either: `box-shadow: 0 0 0 1rem rgba(13,14,16,0.5)`,
   an OUTSET ring. Kept as a shadow for the same reason -- a real `border` would grow the
   track past 3rem and drag the tick centring (top:50%) and the backdrop's bdTop
   centring with it. An outset shadow has ZERO box-model impact, so no box-sizing needed.
   BOTH live on ONE pseudo, with the explicit left/top/width/height box Coherent needs (it
   will not stretch a pseudo from a top+bottom / left+right pair). z-index:1 puts BOTH gradient
   stripes ABOVE the auto-z .mp-fill, and THE GAP STRIPE IS AN OPAQUE DARK COLOUR, not
   `transparent` -- because that is what the hangar bar actually does. Its .moe-fill
   (MoECalculator.css:304-326) has NO background-color whatsoever: it paints
   filled_pattern_small.png ONLY, at the SAME background-size:99rem 2rem / background-position:
   left center as the track's bg_pattern_small, so the two grids are in phase and the fill
   exists ONLY inside the dash marks while the gaps show the dark track backing. The garage
   grid is a MASK, not a wash over a solid bar. This fill IS a solid colour, so the opaque gap
   stripe is what reproduces that read; drop the gap alpha to 0 and the fill floods the gaps
   again (the earlier look, where the bar read as sitting ON TOP of the grid). PHASE: the
   gradient is on the TRACK's pseudo, so its origin is the track's LEFT EDGE -- never the
   fill's right edge -- and the dashes stay in phase across the reached and unreached halves at
   every fill width. Still BELOW the z-index:2 ticks. The ring on the PSEUDO rather
   than on .mp-track also survives .mp-full / .mp-pulse, which both overwrite the track's own
   box-shadow. And because the ring is outset, the fill is flush inside it at 0% and 100%:
   never visually inset, never overlapping. */
.mp-track::after {
  content: "";
  position: absolute; left: 0; top: 0; width: 100%; height: 100%;
  z-index: 1;
  /* WG'S OWN IDIOM for this pattern (mono/battle_pass, mono/hangar): describe exactly ONE
     3rem period in the gradient and let background-size tile it, rather than letting one
     track-wide gradient carry every repeat (that also makes the tiling width-agnostic -- see
     #moe-bar-root's width note for which widths end on a whole dash). Their line is
       background: repeating-linear-gradient(90deg,#ede6d9,#ede6d9 1rem,transparent 1rem,transparent 3rem) left bottom/3rem 1rem;
     Same numbers as before -- 2rem dash + 1rem gap, cream rgb(236,230,218) at 41/255 = 0.16.
     THE GAP IS ALPHA 1, which is what makes the grid read as a MASK over the solid fill (at
     0.5 the green showed through at half strength, so a gap looked lighter to the LEFT of the
     fill edge than to the right -- the "irregular intervals"). The RING keeps 0.5: it sits
     outside the fill and matches the garage's. */
  background-image: repeating-linear-gradient(90deg,rgba(236,230,218,0.16) 0rem,rgba(236,230,218,0.16) 2rem,rgb(13,14,16) 2rem,rgb(13,14,16) 3rem);
  background-size: 3rem 100%;
  background-repeat: repeat;
  box-shadow: 0 0 0 1rem rgba(13,14,16,0.5);
}
/* Explicit dimensions + a single animated property per rule: Gameface will not interpolate
   what it cannot measure, and a transform transition needs matching function lists. */
.mp-fill {
  position: absolute;
  left: 0;
  top: 0;
  height: 100%;
  width: 0;
  background: rgba(237,230,217,0.8);
  transition: width 600ms cubic-bezier(.2,.8,.2,1) 600ms;
}
/* THE FILL IS THE ONE PLACE THE SIGN BECOMES A REAL COLOUR. The text rule further down
   (glow, never a fill) is there to keep NUMERALS legible over bright and dark map areas --
   a solid bar has no glyph to keep readable, so it takes the sign directly. Same upCol /
   dnCol as the numerals' glow, so bar and numbers always agree. Zero delta -> NEITHER class
   -> the neutral background above. Two-class selectors so these out-specify .mp-fill, and
   `transition` is deliberately NOT restated here: width stays the ONLY animated property
   (never `transition: all` -- the background must flip, not interpolate). JS COMMITS the class at
   the same moment it swaps the numeral, i.e. after the entry animation -- and DURING the entry it
   leaves the PREVIOUS run's class in place (an explicit maintainer decision, quoted in full at
   MoEProgress.js showVal), so a bar that was red and stays red never changes colour at all.
   THE NEUTRAL IS CREAM, NOT THE TUNER'S DEFAULT GREEN. fillCol shipped as the SAME
   rgba(123,236,55,0.8) as upCol, which made the neutral state read as a WIN twice over: a zero
   delta was indistinguishable from a positive one, and -- worse -- every COLD damage event flashed
   green while the player was in the red, because showVal(false) used to STRIP both sign classes and
   drop the fill back to this base colour for the whole 600ms entry before the swap re-applied
   .mp-down. It no longer strips them (that is the other half of the same fix), and the neutral is
   now the widget's OWN neutral cream (the same rgb(237,230,217) as the neutral numerals and the
   .mp-end axis ticks) -- reserved for the only two states with nothing committed to show: the FIRST
   show of a battle (no showVal(true) has run yet) and a rounded-zero delta. up/down below are
   untouched: the neutral, the win and the loss are three distinct colours. */
.mp-fill.mp-up   { background: rgba(123,236,55,0.8); }
.mp-fill.mp-down { background: rgba(211,68,63,0.8); }
/* FOUR ticks: the two axis ENDS (prev / next requirement), pre_avg, and proj_avg. */
.mp-tick {
  position: absolute;
  top: 50%;
  width: 2rem;
  height: 9rem;
  transform: translate(-50%, -50%);
  z-index: 2;
}
.mp-tick.mp-end   { background: rgba(237,230,217,0.8); }
.mp-tick.mp-left  { left: 0; }
.mp-tick.mp-right { left: 100%; }
.mp-tick.mp-pre   { background: rgba(237,230,217,0.75); }
/* The CURRENT tick carries its OWN glow: the same two-pass shape (wide pass + tight core) as
   the gold .mp-full ring and the sign/text glows, so the whole bar speaks one visual language.
   SPECIFICITY, deliberately not fought: `#moe-bar-root.mp-full .mp-tick` below is id + 2
   classes and therefore BEATS this 2-class rule, so the moment the requirement is met the gold
   takes over this tick along with the rest of the bar. That is the intent -- met-requirement
   gold owns the whole bar -- so there is no override knob here. `transition` stays LEFT ONLY;
   the glow is static and must not interpolate. */
.mp-tick.mp-proj  {
  background: rgba(255,255,255,1);
  box-shadow: 0 0 6rem rgba(255,255,255,0.5),0 0 2rem rgba(255,255,255,0.5);
  transition: left 600ms cubic-bezier(.2,.8,.2,1) 600ms;
}
/* ...AND IT TAKES THE SIGN, exactly like the numerals it carries (JS toggles .mp-up/.mp-down on
   this tick in the same forEach as .mp-capC's numerals and the fill -- MoEProgress.js showVal).
   Same upCol / dnCol as the text glow, and the tick's OWN 6rem/2rem two-pass geometry from the rule
   above, so only the colour changes. box-shadow is the only possible vehicle: the tick is an empty
   box with no glyphs (text-shadow paints nothing) and filter: drop-shadow would compose with the
   tick's translate(-50%,-50%). NEUTRAL NEEDS NO RULE -- the white above IS the neutral, which is
   precisely "the same colours as the text". SPECIFICITY: these are (0,3,0), out-specifying the
   (0,2,0) base, while `#moe-bar-root.mp-full .mp-tick` is (1,2,0) and still wins on its id, so
   met-requirement gold keeps owning this tick as intended. `transition` is deliberately NOT
   restated (declaration-only override) -- restating it would re-arm the left transition. */
.mp-tick.mp-proj.mp-up   { box-shadow: 0 0 6rem rgba(123,236,55,0.9),0 0 2rem rgba(123,236,55,0.9); }
.mp-tick.mp-proj.mp-down { box-shadow: 0 0 6rem rgba(211,68,63,0.9),0 0 2rem rgba(211,68,63,0.9); }
/* Captions live in the TRACK's coordinate space. The two CENTRE ones stack vertically on
   their tick: pre_avg ABOVE (.up), proj_avg BELOW (.dn, the only one that moves). THAT split
   is load-bearing -- those two sit ~1% apart, so putting them on one side would overlap.
   The AXIS-END one is .side: vertically centred on the track's midline and hanging OUTSIDE its
   right edge (the left-hand .mp-capL twin was removed with the axis-floor numeral). Each caption
   is ONE ROW: icon LEFT (DOM order: icon, value, delta -- and on .mp-capR a SECOND icon+value
   pair for the remaining-battles count, in that order because setIco() / capV() both take the
   FIRST match), numerals right, margin-right as the single gap. GAMEFACE: plain
   `flex-direction: row`; the earlier `column-reverse` variant (never verified in Coherent)
   is gone, so no unverified flex mode remains.
   WHAT translateX(-50%) CENTRES ON THE TICK IS THE NUMERAL, NOT THE ROW. Centring the whole
   box put the DIGITS left of their own tick by half the icon+gap, and on .dn it drifted as
   the delta's text width changed. So both siblings are taken OUT of the width the transform
   halves, each by the mechanism its constraint allows -- the icon by a negative margin that
   cancels its own box (.mp-capP / .mp-capC .mp-ico), the text-width-dependent delta by going
   out of flow (.mp-cap .mp-d) -- leaving the numeral as the caption's ONLY in-flow content,
   so -50% of the box IS -50% of the digits. Same end state as the sibling Damage Efficiency
   bar, reached differently: there .mp-cap is not a flex row at all. */
.mp-cap {
  position: absolute;
  left: 0;
  transform: translateX(-50%);
  display: flex;
  flex-direction: row;
  align-items: center;
  white-space: nowrap;
  z-index: 3;
}
/* PADDING, NOT MARGIN, ON THE `bottom:100%` / `right:100%` SIDE. Coherent ignores a
   margin-bottom on an abspos box anchored by bottom:100% (and margin-right on one anchored by
   right:100%) -- both gaps rendered as 0 in-game and WG's own _dist corpus has 0/515 files
   pairing them. The attested form is padding on the anchored side: `.Consumable_hotKeyLabel`
   in mono/hangar/main/main.css (padding-bottom + bottom:100%) and
   mono/pet_system/pet_storage_tooltip/pet_storage_tooltip.css:23-25 (padding-right +
   right:100%). Same order of magnitude, and safe here for two reasons: neither caption paints a
   background / border / box-shadow, so the enlarged box is invisible; and padding grows the
   box on the anchored AXIS only, while the centring transforms act on the OTHER one
   (translateX(-50%) on .up is unaffected by height, translateY(-50%) on .capR by width).
   The `top:100%` / `left:100%` twins below keep their margins -- those pairings DO work.
   NOT `calc(100% + 6rem)`: a % + rem mix inside one calc() is 0/515 in WG's corpus. */
/* EVERY CAPTION PINS ITS LINE BOX, and that is a BUG FIX, not a style choice. With
   `line-height: normal` the line box is the font's ascent+descent+gap SNAPPED UP TO WHOLE
   DEVICE PIXELS, so in rem it is NOT constant -- it shrinks as the rem->px factor grows. For a
   16rem caption, measured live: 21.000rem at factor 1, 20.500 at 2, 20.125 at 24 (and for the
   12rem delta: 16.000 / 15.500 / 15.083). .mp-ico is a flex item under align-items: center, so
   HALF that variation goes straight into the glyph's Y -- the icon and delta read ~0.75rem low
   relative to the numeral at factor 1 versus factor 2 (reported at 3440x1440).
   THE VALUE: ceil(font_rem * 2 * 1.2565) / 2, i.e. the FACTOR-2 box expressed in rem. 1.2565 is
   MoEBattle.ttf's fitted line ratio and ceil(font_px * 1.2565) reproduces all six measurements
   above. Pinned at the factor-2 value ON PURPOSE rather than at the font's true unsnapped
   ratio: factor 2 is the render this composition was approved on and must not move by even one
   device pixel, while a `1.2565em` line-height computes to 40.2px there and would shift it
   0.75px. Every pin below is therefore byte-identical to what `normal` already yielded at
   factor 2, and only factors != 2 change.
   NO LARGE-MODE TWIN, EVER: line-height is a uniform (vertical) length, so the root font
   (SIZE_F) scales it alone -- a twin would double-apply it. The residual this does NOT fix is
   the glyph's own ascent snap INSIDE the pinned box (sub-0.5rem, and it moves the numeral and
   the delta together rather than pulling them apart).
   ...AND THE PIN IS NOW LOAD-BEARING FOR A SECOND FIX, which is why it must not be reverted or
   turned back into an em: it makes each caption's box a CONSTANT number of rem, so the vertical
   anchor of the pieces hanging off it -- (line box - own box) / 2 + the tuned nudge -- is a
   constant too, and CAN be quantised. It is not, however, a whole number of DEVICE pixels at every
   rem->px factor. Worked out for ALL FIVE pieces this bar hangs off a caption box, in rem:
       .mp-capC .mp-ico   (20.5 - 16  )/2 + 1    == 3.25  <- 0.25 off the device grid at factor 1,
                                                             0.50 off at factor 2: it CAN drift
       .mp-capP .mp-ico   (18   - 14  )/2 + 0    == 2.00  <- whole rem: whole device pixels at EVERY
       .mp-capR .mp-ico   (18   - 17  )/2 + 0.5  == 1.00     factor, so it resolves identically at
       .mp-capR .mp-ico   (18   - 13  )/2 + 0.5  == 3.00     both scales and takes no rule, ever
         ^ the SAME rule, a smaller box: the .battles glyph (see .mp-ico.battles)
       .mp-cap  .mp-d      0           + 2.5     == 2.50  <- 0.5 off the grid at factor 1, whole at
                                                             factor 2: it CAN drift, and the
                                                             maintainer reports it DOES.
   (.mp-capL is GONE, and with it its ruleless (18 - 17)/2 + 0.5 == 1.00 row -- the axis-floor caption
   was removed outright. The battles glyph took its place in the table.)
   THE BATTLES GLYPH'S 13rem BOX IS NOT ARBITRARY: it is .mp-ico's BASE box, so the glyph needs no
   width/height rule at all, and 13 is one of only two boxes (13 and 17) that land this .side
   caption's anchor on a WHOLE rem and so keep the row correctly ruleless -- 14, 15 or 16rem would
   each land on a half and owe a two-rule correction pair of their own.
   The ICON rows are flex items under align-items:center, so the centring term is the flex line's
   cross size -- the numeral's line box, i.e. the pin -- minus the glyph's own square box, and the last
   term is the per-role translateY.
   THE DELTA ROW HAS NO CENTRING TERM, AND AN EARLIER REVISION OF THIS NOTE GOT THAT WRONG. The wrong
   prediction is kept here and corrected in place rather than quietly deleted, because it is the
   plausible reading and the next person will reach for it again.
     THE FAILED PREDICTION: "the delta is out of flow with NO `top`, so it takes the CENTRED static
     position it would have as the sole flex item" -- which is CSS Flexbox's own rule (an abspos
     child's static position is aligned by align-items / justify-content). That yields
     (20.5 - 15.5)/2 + 2.5 == 5.00rem: a whole rem, therefore whole device pixels at every factor,
     therefore "structurally incapable of drifting" -- and on that basis the sibling's delta rule was
     deliberately NOT mirrored. The maintainer then looked at interface scale 1 and reported the delta
     out by the same one device pixel as the icon.
     WHY IT IS WRONG: this engine does not implement that flexbox rule. It puts the abspos child at the
     CSS2.1 static position -- the containing block's content-box origin -- so the used `top` is 0, the
     centring term is absent, and the tuned translateY IS the whole anchor: 2.50rem.
     THE EVIDENCE IS THIS BAR'S OWN APPROVED RENDER, not a spec reading. 2.5rem here is the sibling's
     delta Y carried over verbatim (see the .mp-cap .mp-d note below), and THERE it is measured from an
     explicit `top: 0` and is exactly the value that centres a 15.5rem delta box on a 20.5rem numeral
     box -- (20.5 - 15.5)/2 == 2.5. If this engine also centred by static position, that same 2.5rem
     would put this bar's delta a further 2.5rem (5 device px at factor 2) BELOW its numeral's centre,
     hanging off the bottom of the caption, and the composition approved at factor 2 would show it. It
     does not. So THE TWO DELTAS ARE THE SAME SHAPE, land on the same 2.50rem anchor, and need the same
     correction -- the sibling's rule IS mirrored here after all.
   THE .up / .dn PADDING-vs-MARGIN ASYMMETRY DOES NOT REACH ANY OF THIS, and was checked explicitly.
   `.mp-cap.up` puts its gap in `padding-bottom` (Coherent renders a margin-bottom as 0 against a
   bottom:100% anchor) while `.mp-cap.dn` uses `margin-top`, and a PADDING box is indeed what an
   out-of-flow child's percentage `top` resolves against -- that trap is real, and it is why .mp-capP's
   icon stays IN FLOW as a margin (see the per-role nudge note below). But the delta lives on `.dn`,
   which carries no padding at all, and it declares no `top` to resolve: padding box == content box
   here, at both factors. Not what moved the delta.
   .mp-cap.side .mp-v is deliberately NOT in the table: its own box IS the line box, so the centring
   term is identically 0 at every factor and its -0.5rem is a font-metrics constant, not a scale
   residual.
   A CORRECTION IS NOW SHIPPED for both drifting rows -- the appended interface-scale block at the
   END of this file. It is gated on the `.mp-s1` body class, which MoEBarTransient.setQuantClass()
   adds when captureBaseFont() reads below 1.5: THAT ROOT-FONT CAPTURE IS THE INTERFACE-SCALE SIGNAL
   (below 1.5 at scale 1, at/above it at scale 2), established by a four-bit screenshot probe over two
   fresh launches -- while `devicePixelRatio` and both view ratios read flat across scales and carry
   nothing. Interface scale 2 adds no class at all, so no selector in that block can match there and
   the approved render is structurally unreachable. See
   tests/test_caption_anchor_quantisation.py for the measurements, the gate and the failed attempts. */
.mp-cap.up { bottom: 100%; padding-bottom: 6rem; font-size: 14rem;
             line-height: 18rem; }
.mp-cap.dn { top: 100%; margin-top: 6rem; font-size: 16rem;
             line-height: 20.5rem; }
/* SIDE (axis-end) caption -- ONE of them now (.mp-capR, off the RIGHT end): the axis-floor
   .mp-capL was removed with its numeral, so `.side` is single-use and the `left: auto` +
   `right: 100%` release it needed is gone with it. The class is KEPT rather than folded into
   .mp-capR: it carries the whole side treatment (the .mp-tick vertical trick -- top:50% +
   translateY(-50%) centring the flex row's box on the track midline -- the font-size, the pinned
   line box and the numeral nudge below), and the tuner still emits both halves.
   TWO classes so the transform out-specifies .mp-cap's translateX(-50%): this is not centred on
   a tick, it is pushed off the end by its own margin. Nothing shares its band, so there is no
   de-collision pass and JS never measures or repositions it. The translateY(-50%) is on the
   CAPTION box while the per-role icon nudge is on the .mp-ico CHILD, so the two transforms
   cannot clobber each other and .mp-ico keeps its own stacking context (see below). Its
   font-size is its OWN (not .up's): this is a side label, not a top label. */
.mp-cap.side { top: 50%; transform: translateY(-50%); font-size: 14rem;
               line-height: 18rem; }
/* SIDE-CAPTION NUMERAL NUDGE -- a FONT METRICS correction, not a box-height problem.
   MoEBattle.ttf is ascender 2088 / descender 486 at upem 2048 = a 1.2568em line box
   (17.60rem at the 14rem side font-size), but the digit ink spans only
   -0.0132em..0.7192em of the em box -- so the ink's centre sits 0.0381em = 0.53rem BELOW the
   line box's centre, and it is the BOX that .mp-cap.side's translateY(-50%) centres on the
   track midline. Result: the numerals read ~0.53rem low; this transform pulls them back.
   Do NOT "fix" this with min-height/line-height on the caption -- the box is ALREADY
   17.60rem tall, so any min-height at or below that (the 17rem mark box, say) is a literal
   no-op. (The line-height PIN above is not that fix and does not disturb this one: it states
   the snapped-up box, 18rem, which is what `normal` already yielded at BOTH
   factor 1 and factor 2 for this font size -- it only stops the box shrinking at higher
   factors, and the ink offset it corrects is a font-metrics constant either way.)
   Scoped to .side only: .up/.dn hang off the track edges instead of being centred on
   the midline, so they must never pick this up. .mp-v is a flex item of the .mp-cap row, so
   a transform applies to it (it would not on a bare inline span).
   .mp-eta IS THE SAME CORRECTION ON THE SAME ROW, not an extra: the remaining-battles count is a
   second numeral in this one flex line, at the same font-size and the same pinned line box, so
   the ink offset is identical -- leave it out and the count sits 0.53rem BELOW the requirement it
   counts down to, on the same baseline. */
.mp-cap.side .mp-v,
.mp-cap.side .mp-eta { transform: translateY(-0.5rem); }
.mp-cap.side.mp-capR { left: 100%; margin-left: 3rem; }
.mp-cap.side.mp-capR.mk1 { margin-left: 1.000rem; }
.mp-cap.side.mp-capR.mk3 { margin-left: 5.000rem; }
/* THE BOX-EDGE GAP is a uniform 1rem on every icon -- but each art asset carries its OWN
   background-size zoom (icoFill 0.75 of a DIFFERENT box, per icon), so the box-edge gap alone
   left the rows reading unevenly: each icon's actual INK stops a different distance short of its
   own box edge. PER-ICON MARGIN-RIGHT OVERRIDES below equalise the INK gap instead, box sizes
   left untouched (maintainer's call: "icon sizes must stay the same, adjust paddings
   individually") -- mirroring the vertical composition's identical pass byte-for-byte (see
   MoEProgressVertical.css's own note above `.mpv-ico.dmgp`; the numbers below are IDENTICAL to
   that pass's, because both bars share the same box sizes and the same icon assets). Measured
   live off the real PNGs' alpha>32 bbox (gui-part*.pkg), not estimated:
     dmgp    box 14, ink_x == (42/128)*2.287*14 == 10.506rem, inset (14-10.506)/2 == 1.747rem
     dmgc    box 16 (REFERENCE, untouched), ink_x == (28/128)*3.425*16 == 11.988rem,
             inset == 2.006rem -- base 1rem margin already lands ~3.006rem; every other row is
             calibrated to a flat 3.000rem target against it, same convention as the vertical pass
     moe     box 17, ink_x == (35/128)*2.747*17 == 12.769rem, inset (17-12.769)/2 == 2.115rem
     mk      box 17, `background-size: contain` on a 24x24 canvas scales the WHOLE canvas by
             box/24; calibrated to mark_2 (its ink WIDTH 12 of 24, the tuner's own default
             preview state): ink_x == 17*0.5 == 8.5rem, inset (17-8.5)/2 == 4.25rem. mark_1/
             mark_3 land off this (see .mp-ico.mk's own note) -- an accepted residual, same as
             the vertical bar's identical mark-icon correction
     battles box 13 (base .mp-ico box, unchanged), calibrated on its OWN X-width (27 of a 128px
             canvas -- NOT the maxdim(29) icoSz() zooms it by): ink_x == (27/128)*3.31*13 ==
             9.077rem, inset (13-9.077)/2 == 1.962rem -- see .mp-ico.battles's own rule
   margin-right == 3.00 - inset, REPLACING the shared 1rem outright: dmgp 1.253rem, moe 0.885rem
   (LESS than the shared 1rem: moe's ink is already wide enough that less margin gets it to
   3.00), mk -1.250rem (mark_2's inset alone overshoots the target, so the correction is
   NEGATIVE), battles 1.038rem (added to its existing rule below, alongside margin-left). Compound
   selectors below beat this base rule on SPECIFICITY, not source order (three classes vs two --
   the same convention the vertical pass's per-icon overrides use). The two CENTRE captions
   (dmgp, dmgc) additionally cancel their icon's whole outer width with a negative margin-left
   further down -- see the .mp-capP / .mp-capC rules; dmgp's cancel now reads its OWN 1.253rem
   gap, never the shared one, while dmgc's stays untouched (it never moves). Kept to 3 decimal
   places, matching the vertical composition's own twins -- margin is a plain horizontal length
   with no (rowHeight-box)/2-style quantisation to land on, so unlike a box these carry no
   whole-rem/whole-device-pixel requirement; the residual is well under a rem, the same accepted
   class of drift as this file's own .mp-cap .mp-d gap. */
.mp-cap .mp-ico { margin-right: 1rem; }
.mp-cap .mp-ico.dmgp { margin-right: 1.253rem; }
.mp-cap .mp-ico.moe { margin-right: 0.885rem; }
.mp-cap .mp-ico.mk { margin-right: -1.250rem; }
.mp-cap .mp-ico.mk2 { margin-right: 1.000rem; }
.mp-cap .mp-ico.mk3 { margin-right: 4.000rem; }
/* .mp-eta shares the plain-white numeral treatment: same colour, weight and dark legibility drop as
   .mp-v. It is deliberately NOT a second .mp-v -- capV() is a first-match querySelector(".mp-v") and
   would keep resolving to the requirement, so a second .mp-v would work today and mis-target on the
   next edit. It DOES glow now (.mp-eta.mp-up / .mp-eta.mp-down, below), but on the delta's OWN knobs
   -- st.upCol/st.dnCol, st.dGlowW/st.dGlowT, the same DGA -- and gains no dedicated knobs of its own;
   JS toggles it in lockstep with capDN off the identical d>0/d<0 test (MoEProgress.js showVal). So
   .mp-capR is no longer a never-glows caption: its main requirement number (.mp-capR .mp-v) still
   stays plain white, but the battles-countdown numeral rides the bottom-centre delta's sign. */
.mp-cap .mp-v,
.mp-cap .mp-eta,
.mp-cap .mp-d {
  color: #ffffff;
  font-weight: 600;
  letter-spacing: 0em;
  text-shadow: 0rem 0rem 1rem rgba(0,0,0,0.5);
}
/* FOR TEXT THE SIGN IS A COLOURED GLOW, NEVER A FILL (shipped .mb-up/.mb-down): the numerals
   stay WHITE and a green/red text-shadow halo carries the sign, layered OVER the dark
   legibility drop so it reads on bright AND dark map areas. Do NOT "fix" this into
   color: green/red. (The .mp-fill.mp-up/.mp-down rules above ARE a real colour fill, on
   purpose: that argument is about keeping GLYPHS readable and a solid bar has no glyph.
   Text glows, bar fills, both off the same upCol/dnCol -- do not "unify" them either way.)
   Triple shadow: dark drop, WIDE pass, TIGHT core pass.
   THE SPLIT (verbatim from MoEBattle.css's .mb-delta > .mb-delta-num): the delta wrapper
   .mp-d holds the PARENS as static text nodes and keeps the plain white treatment; only
   its .mp-d-num child carries the signed digits and the glow -- so "(" and ")" never glow.
   Markup: <span class="mp-d">(<span class="mp-d-num">+8</span>)</span>.
   WHO GLOWS: the BOTTOM-CENTRE caption only -- its main number (.mp-capC .mp-v) and the
   delta number, both off the SAME proj_avg - pre_avg sign. The two requirement captions and
   the top-centre pre_avg caption are plain white: JS must never put .mp-up/.mp-down on
   them. A ZERO delta gets NEITHER class -> white + the dark drop only, so a sub-precision
   change never reads as a win. (The selectors are element-scoped, .mp-v.mp-up not bare
   .mp-up, so they out-specify the .mp-cap .mp-v base rule above.)
   WHEN: not while the bar is arriving. An EXPLICIT MAINTAINER DECISION (quoted verbatim at
   MoEProgress.js showVal) governs the 600ms entry window: it must show the PREVIOUS COMMITTED
   state, so the entry does NOT clear these classes -- a new sign is only claimed once it lands at
   the swap (valueSwapMs), together with the numeral, the delta and the fill. Was red and stays red
   therefore never flickers. The plain-white neutral is reserved for the two states where nothing is
   committed: the FIRST show of a battle, and a rounded-zero delta (which the swap DOES clear to --
   that is the one place removing a class is still required). Do NOT "restore" a class-strip to the
   entry path. */
/* em, not rem: the two caption rows have different font-sizes and this gap should track
   them. 0.35em == the shipped .mb-delta's 4.5rem at its 14rem font-size.
   SIZE + NUDGE ARE THE EFFICIENCY BAR'S, carried over after a live pass (MoEEfficiency.css's
   `.mp-cap .mp-d`: font-size 12rem, translate(4.2rem, 2.5rem)). The X half must NOT be added
   again: 0.35em of the delta's OWN 12rem font-size IS 4.2rem, which is exactly how that 4.2rem
   was tuned. So the font-size below is load-bearing for the gap too -- change it and the gap
   moves with it.
   OUT OF FLOW off the numeral's right edge -- the second half of the numeral-centring in
   .mp-cap's note. A negative margin cannot cancel THIS sibling the way it cancels the icon:
   the digits change, so any fixed value would leave the centring drifting with the delta's
   text width. `left: 100%` + margin-left is the SAFE anchored pair (Coherent honours the
   left/top twins; it is `right:100%`+margin-right and `bottom:100%`+margin-bottom that render
   a 0 gap), and it keeps the 0.35em gap byte-for-byte as tuned. Same idiom as the sibling
   MoEEfficiency.css, one declaration short of it: no `top` here. THAT OMISSION BUYS NOTHING, and
   the note that used to defend it was wrong -- see the failed prediction worked through in the
   caption-pin block above. This engine resolves an omitted `top` to the CSS2.1 static position,
   the content-box origin, which is precisely what the sibling spells out as `top: 0`; it does NOT
   apply flexbox's align-items centring to an out-of-flow child. So the two bars' deltas are the
   SAME shape, the translateY below is the whole Y story on both, and 2.5rem lands the delta box
   centred on the numeral's on both. Adding `top: 0` here would be a no-op, not a fix -- and the
   Y carried over from that bar is only correct BECAUSE the two agree.
   THE DELTA FADES IN at the numeral swap (valueSwapMs): JS sets opacity 1 there and back to
   0 when it re-runs the transient -- the curve is here, not in JS. OPACITY, not visibility
   (which cannot interpolate). display:none would no longer disturb the centring now that the
   box is out of flow -- it DID before, and that is why opacity was picked -- but opacity is
   what interpolates, so it stays. No
   `visibility` alongside: this whole widget is pointer-events:none, so a 0-alpha box has
   nothing to hit-test or focus. ONE transition declaration here, naming ONLY opacity, with
   EXPLICIT ms + easing -- Gameface drops a transition on a property whose value starts from
   a var() it cannot resolve, so never express these two through a custom property.
   CANCELLING it (a re-run mid-fade): set transition:none, opacity 0, force a reflow, then
   restore the transition -- the same idiom the fill/tick rewind uses. */
.mp-cap .mp-d {
  position: absolute;
  left: 100%;
  margin-left: 0.35em;
  font-size: 12rem;
  transform: translateY(1.5rem);
  line-height: 15.5rem;
  opacity: 0;
  transition: opacity 600ms cubic-bezier(.2,.8,.2,1);
}
.mp-v.mp-up,
.mp-d-num.mp-up,
.mp-eta.mp-up {
  color: #ffffff;
  text-shadow: 0rem 0rem 1rem rgba(0,0,0,0.5),
               0rem 0rem 6rem rgba(123,236,55,0.9),
               0rem 0rem 1rem rgba(123,236,55,0.9);
}
.mp-v.mp-down,
.mp-d-num.mp-down,
.mp-eta.mp-down {
  color: #ffffff;
  text-shadow: 0rem 0rem 1rem rgba(0,0,0,0.5),
               0rem 0rem 6rem rgba(211,68,63,0.9),
               0rem 0rem 1rem rgba(211,68,63,0.9);
}
/* Only the bottom-centre caption animates (it rides proj_avg); pre_avg's stays put. */
.mp-cap.mp-capC { transition: left 600ms cubic-bezier(.2,.8,.2,1) 600ms; }
/* Icon glyphs. GLYPH on ::after, GLOW on ::before with z-index:-1 -- an element's own
   background paints BELOW its pseudos, which is why the two are split (same as .mb-ico).
   The transform keeps .mp-ico a stacking context so that -1 stays scoped here. 106% == the
   overlay's 18rem glow behind a 17rem icon, as a ratio so it follows either box. The glow is
   TWO COLOURS: this base rule is the gold halo the CENTRE damage icons wear; the two axis-end
   requirement marks override it to a dark drop in the next rule.
   FRAMING is derived, not a flat zoom: background-size = 100*(canvas/glyph)*0.75
   from the MEASURED bboxes (damage 0.219, barrel_mark 0.328, top 0.273 of the 128px canvas), computed
   PER ICON -- the top and bottom centre glyphs are chosen independently, so each carries its
   own background-size. The shipped overlay's flat 260% framed those two at 57% vs 85% fill
   -- visibly different.
   NOTE: .mb-ico.dmg in the shipped widget actually paints barrel_mark, so "match the
   in-battle widget" and "use a distinct damage glyph" conflict -- this build picked
   barrel_mark (top) / damage (bottom). brightness(3) lifts the flat grey #d1d1d1 quest_type line art; the
   marksOnGun cuts are 24x24 and ALREADY warm cream (~#ede6d9) -> NO brightness on them.
   Their canvas is constant (glyph y 5..17) and only the WIDTH grows with the count
   (mark_1 x 9..14, mark_2 x 6..17, mark_3 x 3..20), so background-size:contain on ONE
   fixed box renders mark_1 at ~1/3 the width of mark_3 -- do NOT trim per count. At 24px
   of source art they visibly blur above ~24rem. */
.mp-ico {
  position: relative;
  display: block;
  flex: none;
  width: 13rem;
  height: 13rem;
  transform: translate(0rem, 0rem);
}
/* PER-ROLE VERTICAL NUDGE. Each glyph family sits differently on its baseline (24px
   marksOnGun cuts vs 128px quest_type line art), so every caption's icon gets its own
   signed Y. It MUST stay on this same `transform`: the transform is what makes .mp-ico a
   stacking context and so scopes the ::before glow's z-index:-1 -- swap it for a margin and
   the glow escapes and paints under the whole caption. ::before is centred INSIDE this
   transformed box (left/top 50% + its OWN translate(-50%,-50%)), so the glow travels with
   the glyph and its centring is unaffected at any Y.
   ...AND, ON THE TWO CENTRE CAPTIONS ONLY, THE ICON'S WIDTH CANCELLED -- the first half of the
   numeral-centring in .mp-cap's note. margin-left is -(this caption's own icon box + ITS OWN
   margin-right gap), so the icon's OUTER width is exactly 0 (-box-gap + box + gap): the numeral
   starts at the caption's origin and the glyph still paints its own gap to its left, unmoved. A
   MARGIN and not position:absolute precisely so the icon stays IN FLOW -- it keeps the transform
   above (both the Y and the stacking context), and out of flow it would need a top:50% that, on
   .up, resolves against a PADDING box carrying 6rem and would drop the glyph half that gap.
   PER CAPTION because the box AND the gap are both per caption now (dmgP / dmgC are independent
   sliders, and dmgP's ink-gap correction above replaces its slice of the shared icoGap) -- DERIVED
   from those, never a literal, or a retune breaks the centring. dmgC still reads the shared
   icoGap (it is the untouched reference), so its cancel is unchanged. NOT on the .side caption:
   it is not centred on anything, it is pushed off the axis end by its own gap, so cancelling its
   icon would just slide the label inwards over the track.
   .mp-capR NOW CARRIES TWO ICONS AND THIS ONE RULE NUDGES BOTH -- the mark glyph and the battles
   glyph. That is deliberate, and it is arithmetic rather than luck: the 0.5rem was tuned to push
   the marksOnGun cuts' ink (y 5..17 of a 24px canvas, ink centre 0.458 of the box) back onto the
   numerals' centre, and the battles glyph's alpha>32 ink centre sits at 62.5/128 == 0.488 of its
   own canvas -- 0.012 of a 13rem box == 0.16rem of residual, a sixth of the nudge itself. So no
   second knob is added here: if a live pass ever shows the battles glyph wants its own Y it gets
   its OWN rule (`.mp-capR .mp-ico.battles`, full declaration -- a transform REPLACES its base),
   and this shared 0.5rem is NOT retuned, or the mark glyph moves with it.
   NEEDS VISUAL CONFIRMATION IN-CLIENT: the 0.16rem residual is derived from the bbox, not seen. */
.mp-capP .mp-ico { transform: translate(0rem, 0rem); margin-left: -15.253rem; }
.mp-capC .mp-ico { transform: translate(0rem, 1rem); margin-left: -17rem; }
.mp-capR .mp-ico { transform: translate(0rem, 0.5rem); }
.mp-ico::before {
  content: "";
  position: absolute;
  left: 50%;
  top: 50%;
  z-index: -1;
  width: 106%;
  height: 106%;
  transform: translate(-50%, -50%);
  background: radial-gradient(circle at 50% 50%, rgba(255,205,90,0.5) 0%, transparent 73%);
}
/* THE AXIS-END (.side) CAPTION'S ICONS GLOW INDEPENDENTLY of the two centre damage icons -- own
   colour, own alpha, and TUNED APART: these are a DARK DROP (near-black #1a1a1a at half alpha)
   rather than a halo, while the centre pair keeps the gold. Deliberate, not a
   leftover -- the mark glyphs read better lifted off the map by a shadow.
   This targets ::before and sets BACKGROUND ONLY, so:
     - the base rule above still supplies z-index:-1, the 106% box and its own
       translate(-50%,-50%), i.e. the glow's radius geometry is identical for both groups;
     - .mp-ico's OWN transform is not touched, and that matters twice over -- it carries the
       per-role Y nudge (icoYR) AND it is the stacking context that scopes the
       z-index:-1 to the icon. Never move this override onto .mp-ico.
   Matches BOTH of this caption's icons -- the mark (or the general-MoE glyph that replaces it at 3
   marks) and the battles glyph -- because both are `.mp-capR .mp-ico`. Specificity (0,2,1) > the
   base (0,1,1), so only the gradient is replaced. But only the MARK glyph actually shows this drop:
   the battles glyph opts back OUT to gold via `.mp-ico.battles::before` (below), which matches
   at the SAME (0,2,1) specificity, so the cascade falls through to SOURCE ORDER and the later rule
   wins on that one icon. That is a source-order dependency, not a specificity one -- reorder the
   two rules (or insert another (0,2,1) `::before` rule ahead of the battles one) and the battles
   glyph silently reverts to the dark drop with no error anywhere; verify the resolved styles, not
   the file's line numbers, after any such reorder.
   (The tuner's emitted form groups `.mp-capL .mp-ico::before` in front of this; that half went
   with the caption.) */
.mp-capR .mp-ico::before {
  background: radial-gradient(circle at 50% 50%, rgba(26,26,26,0.5) 0%, transparent 73%);
}
.mp-ico::after {
  content: "";
  position: absolute; left: 0; top: 0; width: 100%; height: 100%;
  background-repeat: no-repeat;
  background-position: center;
}
/* dmgp = TOP centre (pre_avg), dmgc = BOTTOM centre (proj_avg) -- independent glyph AND box. */
.mp-ico.dmgp { width: 14rem; height: 14rem; }
.mp-ico.dmgc { width: 16rem; height: 16rem; }
.mp-ico.dmgp::after {

   THREE shared subjects -- `body`, `#moe-bar-box` and `#moe-bar-root` -- and those are the only
   selectors here that carry the `body.mpv` scope. `mpv` goes on the BODY (MoEBarTransient's
   goVertical), because #moe-bar-box is a body-level SIBLING of the JS-created root and a class on
   the root could never reach it; `body.mpv ...` is also (1,1,1) so it out-specifies the horizontal
   sheet's own `.mp-lg #moe-bar-root` (1,1,0) outright rather than winning on source order.

   THE SHIPPED FILE IS THE EMIT PLUS SIX DELIBERATE HAND-EDITS -- never copy an -EmitCss output
   over it (the repo lesson `emitcss-is-not-the-whole-shipped-stylesheet`; MoEProgress.css carries
   the same warning for its own four). Each one is marked HAND-EDIT n/6 at its site:
     1  the root rule: the tuner stage's `position: relative` becomes the shipped
        `position: absolute; left: 0; top: 0` + z-index/pointer-events, and the selector is scoped.
     2  #moe-bar-box, the sizing shim -- not emitted at all (the tuner has no surface).
     3  the dash grid's GAP STRIPE goes OPAQUE (alpha 1), where the tuner's `gapA` default is 0.5.
     4  `.mpv-lg` becomes `.mp-lg` -- the body class MoEBarTransient.applySize actually writes.
     5  the two Large rules whose subject is #moe-bar-root / #moe-bar-box are scoped `body.mpv.mp-lg`.
     6  THE ETA ROW SPLIT (maintainer's call, ported here only -- the tuner's own capR markup keeps
        both numeral+icon groups on ONE row, untouched) plus a per-icon MARGIN-ONLY ink-gap parity
        pass (corrected 2026-08-08: an earlier version of this edit also resized the icon BOXES --
        the maintainer reverted that outright, "icon sizes must stay the same, adjust paddings
        individually", so every box below is back at its pre-split size and only margin-left
        differs from the shared 1rem). Replaces the old "eta-gap retarget" hand-edit outright (a
        single-row concept the split makes moot, not something to carry alongside a new #7):
          * a NEW `.mpv-capEta` rule (eta numeral + battles icon) is inserted right after
            `.mpv-capR` (now JUST the requirement numeral + mark icon), stacked directly above it
            via `bottom: 100%; padding-bottom: 30rem` -- 30 == capR's own box height (18rem
            line-height + 6rem padding-bottom == 24) plus a 6rem visual gap, matching this file's
            own "clear the track" gap magnitude elsewhere. Same right-anchor mechanism
            (padding-right/transform/font-size/line-height) copied verbatim from capR, since both
            rows shared it identically before the split.
          * the old combined `.mpv-capR .mpv-ico` / `.mpv-capR .mpv-v, .mpv-capR .mpv-eta`
            Y-nudge rules split into their own per-row copies (capR keeps the mark icon + `.mpv-v`
            nudge; capEta gets an identical copy for the battles icon + `.mpv-eta` nudge -- same
            row line-height, same nudge value, so the SAME quantisation holds for both). This part
            is UNAFFECTED by the box revert (margin never touches this Y quantisation at all).
          * FOUR per-icon margin-left overrides close the ink-gap residual the shared 1rem base
            leaves, measured live off the real PNGs' alpha>32 bounding box (not estimated): dmgp
            +0.253rem, moe -0.115rem, mk -2.25rem, battles +0.038rem off the base 1rem -- see each
            rule's own note below for the derivation. `.mpv-ico.dmgc` is the UNTOUCHED reference
            (16rem box, base 1rem margin already lands ~3.006rem of ink gap) that every other row
            is calibrated against; nothing about it moves.
        The old #6 retarget (`.mpv-capR .mpv-eta` margin-left -> `.mpv-v`) no longer applies: with
        the groups on separate rows there is no single shared row left to retarget the gap onto.
   Anything else diverging from a fresh emit is drift, not intent. */

/* HAND-EDIT 1/6. Emitted as a bare `#moe-bar-root { position: relative; ... }` -- the tuner stage
   flows the bar inside an .mpv-anchor wrapper, whereas the shipped bar IS the document: absolute at
   the origin (MoEBarTransient's mount then writes the rigid left/top shift into the surface),
   z-index above the HUD, and pointer-events:none because this bar is pure info and must never be an
   input target. The tuner emits none of those three. width/height/font/text-align/opacity are the
   emit verbatim: 3rem of track cross-section, 200rem of axis. */
body.mpv #moe-bar-root {
  position: absolute;
  left: 0;
  top: 0;
  width: 3rem;
  height: 200rem;
  z-index: 9000;
  pointer-events: none;
  font-family: "MoEBattle", "Arial Narrow", sans-serif;
  text-align: center;
  opacity: 0;
}
/* HAND-EDIT 2/6 -- THE SIZING SHIM, the vertical twin of MoEProgress.css's own. #moe-bar-root is
   position:absolute and contributes ZERO content size, so #moe-bar-box (declared in
   MoEProgressView.html, NOT JS-created -- it must exist at the FIRST layout pass) is what gives the
   document in-flow content. IT DOES NOT STOP THE ENGINE'S SIZE TIMEOUT -- that was re-measured live
   on the horizontal bar and disproven; MoEBarTransient's post-deadline SURFACE_REASSERT_MS is the
   only fix. The box is kept because it is the honest description of the document's size, and the
   horizontal sheet's 380x92 is the WRONG WAY ROUND for this composition.
   198 x 320 MIRRORS the vertical surface MoEProgress.js pushes -- width V_BOX_W_REM + 2*V_PAD_X_REM
   == 72+126, height V_BOX_H_REM + 2*PAD_REM - V_CLIP_B_REM == 360+20-60, the same
   mirrored-constant contract as the JS's vertical shiftY <-> Python's
   domain/constants.VERTICAL_ANCHOR_Y_SHIFT: change one, change all three.
   THE X PAD IS 63rem, NOT PAD_REM's 10, and it applies to BOTH sides (read V_PAD_X_REM's note in
   MoEProgress.js): the three captions are right-anchored and grow LEFTWARD past .mpv-backdrop by
   design, so the SURFACE has to reach out to their ink while the backdrop deliberately does not --
   and it is mirrored onto the unused right side because the centred alignment centres the SURFACE.
   Do NOT "restore the symmetry" by moving .mpv-backdrop, and do NOT trim the right side.
   THE HEIGHT IS 60rem SHORT OF THE COMPOSITION ON PURPOSE, and that is the surface's own doing, not
   this rule's: the surface CLIPS .mpv-backdrop's lower bleed so the engine's screen clamp can bring
   the bar's track down to the tuner's 30-logical-px gap off the screen bottom (read
   MoEProgress.js's V_CLIP_B_REM note -- it carries the whole derivation). This rule only keeps
   describing whatever the surface actually is. It stays a plain rem box either way, so it cannot
   reflow the composition when the surface shrinks past it. */
body.mpv #moe-bar-box { width: 198rem; height: 320rem; }
.mpv-backdrop {
  position: absolute;
  left: -34rem;
  top: -80rem;
  width: 72rem;
  height: 360rem;
  z-index: 0;
}
.mpv-backdrop::before {
  content: "";
  position: absolute; left: 0; top: 0; width: 100%; height: 100%;
  background: url(checker.png) repeat;
  background-size: auto;
  background-position: 0px 0px;
  image-rendering: pixelated;
  opacity: 0.1;
  mask: radial-gradient(56% 110% at 50% 50%,#000 0%,transparent 67%);
}
.mpv-backdrop::after {
  content: "";
  position: absolute; left: 0; top: 0; width: 100%; height: 100%;
  z-index: -1;
  background: radial-gradient(76% 57% at 50% 50%,rgba(0,0,0,0.35) 0%,rgba(0,0,0,0) 70%);
}
.mpv-track {
  position: relative;
  z-index: 1;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.45);
}
/* Garage dash grid, rotated (0deg == "to top", so the first stop sits at the BOTTOM edge).
   background-size: 100% <period>rem tiles the gradient from a single period-sized tile instead of
   rasterizing it once across the whole track length -- without it the dash ink smeared over ~4
   device px instead of a crisp 2 (the sibling MoEEfficiencyVertical.css carries the identical fix,
   and used to have the identical defect before today). The period is still a Y-length the root
   font already scales via SIZE_F, which is why the .mp-lg block below declares no twin for it.
   HAND-EDIT 3/6: THE GAP STRIPE IS ALPHA 1, where the tuner's `gapA` default is 0.5 (inherited from
   the horizontal tuner's). The garage look this clones is a MASK over the solid fill
   (`garage-progress-bar-fill-is-a-mask`): at 0.5 the fill shows through and the grid reads as a
   tint, so a gap looks lighter on the filled side of the edge than on the empty side. The shipped
   horizontal bar already carries the identical rewrite (MoEProgress.css:152, `rgb(13,14,16)`).
   THE RING KEEPS 0.5 -- it is a separate knob (bdrCol/bdrA), it sits OUTSIDE the fill, and it
   matches the garage's. Do not "fix" it to match. */
.mpv-track::after {
  content: "";
  position: absolute; left: 0; top: 0; width: 100%; height: 100%;
  z-index: 1;
  background-image: repeating-linear-gradient(0deg,rgba(236,230,218,0.16) 0rem,rgba(236,230,218,0.16) 2rem,rgba(13,14,16,1) 2rem,rgba(13,14,16,1) 3rem);
  background-size: 100% 3rem;
  box-shadow: 0 0 0 1rem rgba(13,14,16,0.5);
}
.mpv-fill {
  position: absolute;
  left: 0;
  bottom: 0;
  width: 100%;
  height: 0;
  background: rgba(237,230,217,0.8);
  transition: height 600ms cubic-bezier(.2,.8,.2,1) 600ms;
}
.mpv-fill.mpv-up   { background: rgba(123,236,55,0.8); }
.mpv-fill.mpv-down { background: rgba(211,68,63,0.8); }
.mpv-tick {
  position: absolute;
  left: 50%;
  z-index: 2;
}
.mpv-tick.mpv-end {
  background: rgba(237,230,217,0.8);
  width: 9rem;
  height: 2rem;
  transform: translate(-50%, 50%) translateX(0rem);
}
.mpv-tick.mpv-bottom { bottom: 0; }
.mpv-tick.mpv-top    { bottom: 100%; }
.mpv-tick.mpv-pre {
  background: rgba(237,230,217,0.75);
  width: 9rem;
  height: 2rem;
  transform: translate(-50%, 50%) translateX(0rem);
}
.mpv-tick.mpv-proj  {
  background: rgba(255,255,255,1);
  box-shadow: 0 0 6rem rgba(255,255,255,0.5),0 0 2rem rgba(255,255,255,0.5);
  width: 9rem;
  height: 2rem;
  transform: translate(-50%, 50%) translateX(0rem);
  transition: bottom 600ms cubic-bezier(.2,.8,.2,1) 600ms;
}
.mpv-tick.mpv-proj.mpv-up   { box-shadow: 0 0 6rem rgba(123,236,55,0.9),0 0 2rem rgba(123,236,55,0.9); }
.mpv-tick.mpv-proj.mpv-down { box-shadow: 0 0 6rem rgba(211,68,63,0.9),0 0 2rem rgba(211,68,63,0.9); }
/* FIXED-ANCHOR captions, digit-count-independent (bug fix, mirrors
   eff_bar_tuner_vertical.html's shipped fix for the same defect): a shrink-wrapped box
   centred via left:50%+translateX(-50%) never gives any child a truly fixed screen position
   (both its edges move as content width changes), so all THREE captions now share ONE fixed
   right edge -- right:100%+left:auto, pinned to the track's own left edge -- clear of the
   tick's outer-edge overhang via the shared padding-right below. Numeral-then-icon DOM order
   means each caption's icon is the LAST in-flow child, so it sits flush against that fixed
   edge and is provably invariant to digit count. Only the numeral (and capC's delta, hanging
   off ITS left edge) grows/shrinks LEFTWARD, away from the anchor. capP is also the ONLY one
   that moves, tracking the pre tick's `bottom` -- and like that tick it never animates within
   one replay, so no transition is declared.
   DO NOT "OPTICALLY CENTRE" THE ABOVE/BELOW CAPTIONS. Because they are right-anchored and grow
   leftward, they read right-aligned against that line rather than centred over the track, and
   their apparent gap from the track's centreline varies with digit count even though the anchor
   never moves. Centring them needs a WIDTH-SCALED term -- which IS the bug this replaced. A
   non-zero residual nudge is fine; a nudge whose value is a function of the caption's own content
   width is the defect. */
.mpv-cap {
  position: absolute;
  display: flex;
  flex-direction: row;
  align-items: center;
  white-space: nowrap;
  z-index: 3;
  right: 100%;
  left: auto;
}
/* Gameface drops margin on the bottom/right ANCHORED side (gameface-drops-margin-on-the-
   anchored-side) -- padding on the bottom/right anchored sides; margin works as written on
   capC's top:100% anchor. padding-right (shared by all three captions) also carries the
   tick's outer-edge overhang (see the anchor comment above), so it clears the tick, not just
   the track. */
.mpv-capR { bottom: 100%; padding-bottom: 6rem; padding-right: 6rem;
            transform: translateX(14rem); font-size: 14rem; line-height: 18rem; }
/* HAND-EDIT 6/6: the ETA row, stacked directly above capR (maintainer's call: "move the ETA on
   top of the next mark requirement"). Same right-anchor mechanism as capR, copied verbatim --
   both rows shared it identically before the split. `padding-bottom: 30rem` == capR's own box
   height (18rem line-height + 6rem padding-bottom == 24) plus a 6rem visual gap off it, the same
   magnitude this file already uses to clear the track (capR's own 6rem, capC's 6rem). Re-derived
   in tests/test_progress_surface_mirror.py's Y-fit test against V_BOX_TOP_REM + PAD_REM, never
   hardcoded there. */
.mpv-capEta { bottom: 100%; padding-bottom: 30rem; padding-right: 6rem;
              transform: translateX(14rem); font-size: 14rem; line-height: 18rem; }
.mpv-capC { top: 100%; margin-top: 6rem; padding-right: 6rem;
            transform: translateX(16rem); font-size: 16rem; line-height: 20.5rem; }
.mpv-capP { padding-right: 6rem; transform: translateY(50%) translateX(0rem);
            font-size: 14rem; line-height: 18rem; }
/* Icon follows its numeral (DOM order: numeral, then icon) -- gap on the icon's LEFT. */
.mpv-cap .mpv-ico { margin-left: 1rem; }
.mpv-cap .mpv-v,
.mpv-cap .mpv-eta,
.mpv-cap .mpv-d {
  color: #ffffff;
  font-weight: 600;
  letter-spacing: 0em;
  text-shadow: 0rem 0rem 1rem rgba(0,0,0,0.5);
}
/* Delta is an IN-FLOW flex child, ordered FIRST (delta, numeral, icon) -- an ordinary
   margin-right gap, not an out-of-flow box hanging off a content-dependent edge (the exact
   mechanism of the digit-count bug this fixes). */
.mpv-cap .mpv-d {
  margin-right: 0.35em;
  font-size: 12rem;
  transform: translateY(1.5rem);
  line-height: 15.5rem;
  opacity: 0;
  transition: opacity 600ms cubic-bezier(.2,.8,.2,1);
}
.mpv-v.mpv-up,
.mpv-d-num.mpv-up,
.mpv-eta.mpv-up {
  color: #ffffff;
  text-shadow: 0rem 0rem 1rem rgba(0,0,0,0.5),
               0rem 0rem 6rem rgba(123,236,55,0.9),
               0rem 0rem 1rem rgba(123,236,55,0.9);
}
.mpv-v.mpv-down,
.mpv-d-num.mpv-down,
.mpv-eta.mpv-down {
  color: #ffffff;
  text-shadow: 0rem 0rem 1rem rgba(0,0,0,0.5),
               0rem 0rem 6rem rgba(211,68,63,0.9),
               0rem 0rem 1rem rgba(211,68,63,0.9);
}
.mpv-ico {
  position: relative;
  display: block;
  flex: none;
  width: 13rem;
  height: 13rem;
  transform: translate(0rem, 0rem);
}
.mpv-capP .mpv-ico { transform: translate(0rem, 0rem); }
.mpv-capC .mpv-ico { transform: translate(0rem, 1rem); }
.mpv-capR .mpv-ico { transform: translate(0rem, 0.5rem); }
.mpv-capR .mpv-v { transform: translateY(-0.5rem); }
/* capEta's own copy of the SAME nudge, same row line-height (18rem) -- so the identical
   quantisation ((rowHeight-box)/2+nudge landing on a whole rem) holds for both rows. */
.mpv-capEta .mpv-ico { transform: translate(0rem, 0.5rem); }
.mpv-capEta .mpv-eta { transform: translateY(-0.5rem); }
.mpv-capC .mpv-v { transform: translateY(-0.5rem); }
.mpv-capP .mpv-v { transform: translateY(-0.5rem); }
.mpv-ico::before {
  content: "";
  position: absolute;
  left: 50%;
  top: 50%;
  z-index: -1;
  width: 106%;
  height: 106%;
  transform: translate(-50%, -50%);
  background: radial-gradient(circle at 50% 50%, rgba(255,205,90,0.5) 0%, transparent 73%);
}
.mpv-capR .mpv-ico::before {
  background: radial-gradient(circle at 50% 50%, rgba(26,26,26,0.5) 0%, transparent 73%);
}
.mpv-ico::after {
  content: "";
  position: absolute; left: 0; top: 0; width: 100%; height: 100%;
  background-repeat: no-repeat;
  background-position: center;
}
.mpv-ico.dmgp { width: 14rem; height: 14rem; }
.mpv-ico.dmgc { width: 16rem; height: 16rem; }
.mpv-ico.dmgp::after {
  background-image: url(img://gui/maps/icons/personal_missions_30/quest_type/128x128/icon_battle_condition_barrel_mark.png);
  background-size: 228.7%;
  filter: brightness(3);
}
.mpv-ico.dmgc::after {
  background-image: url(img://gui/maps/icons/personal_missions_30/quest_type/128x128/icon_battle_condition_damage.png);
  background-size: 342.5%;
  filter: brightness(3);
}
.mpv-ico.moe { width: 17rem; height: 17rem; }
.mpv-ico.moe::after {
  background-image: url(img://gui/maps/icons/personal_missions_30/quest_type/128x128/icon_battle_condition_top.png);
  background-size: 274.7%;
  filter: brightness(3);
}
.mpv-ico.mk { width: 17rem; height: 17rem; }
.mpv-ico.mk::after { background-size: contain; }
.mpv-ico.mk1::after { background-image: url(img://gui/maps/icons/library/marksOnGun/mark_1.png); }
.mpv-ico.mk2::after { background-image: url(img://gui/maps/icons/library/marksOnGun/mark_2.png); }
.mpv-ico.mk3::after { background-image: url(img://gui/maps/icons/library/marksOnGun/mark_3.png); }
/* PER-ICON MARGIN CORRECTIONS (2026-08-08 redo of the HAND-EDIT 6/6 ink-gap pass -- boxes are back
   at their pre-039a58c sizes above: "icon sizes must stay the same, adjust paddings individually").
   Every icon here is framed by a FIXED background-size, so its ink WIDTH is a fixed fraction of
   its own box, independent of margin -- re-measured live off the real PNGs' alpha>32 bbox
   (gui-part*.pkg), not estimated or carried over from the box-lever version:
     dmgp    box 14, ink == 0.75*box (icoFill) == 10.505rem, inset (14-10.505)/2 == 1.747rem
     dmgc    box 16 (REFERENCE, untouched), ink == 0.75*box == 11.988rem, inset == 2.006rem --
             base 1rem margin already lands ~3.006rem; every other row targets this exactly
     moe     box 17, ink == 0.75*box (icoFill, calibrated on its own wider X dimension) ==
             12.769rem, inset (17-12.769)/2 == 2.115rem
     mk      box 17, `background-size: contain` on a 24x24 canvas scales the WHOLE canvas by
             box/24 (box == canvas aspect), and the pip ink's OWN width varies by mark count
             (measured alpha>32 bbox: mark_1 6px, mark_2 12px, mark_3 18px, all of 24) -- NOT the
             fixed icoFill ratio the other icons get, so no static margin equalises every count
             (the code already forbids re-zooming per count above). Calibrated to mark_2
             (12/24 == 0.5, the tuner's own default preview state): ink == 17*0.5 == 8.5rem,
             inset (17-8.5)/2 == 4.25rem
     battles box 13 (base .mpv-ico box, UNCHANGED), calibrated on its own TALLER dimension
             (measured bbox 27x29 of a 128px canvas -- height, not width, hits icoFill 0.75), so
             its WIDTH ink fraction is NOT 0.75 like the others: (27/128)*331.0% == 0.6982*box ==
             9.077rem, inset (13-9.077)/2 == 1.962rem
   Target ink gap == 3.00rem (dmgc's own reference) on every row; margin-left == target - inset,
   replacing the shared 1rem outright (not adding to it):
     dmgp    3.00 - 1.747 == 1.253rem
     moe     3.00 - 2.115 == 0.885rem   (LESS than the shared 1rem -- moe's own ink is already
             wide enough that less margin than the base gets it to 3.00)
     mk      3.00 - 4.25  == -1.25rem   (mark_2's inset alone overshoots the target, so the
             correction is NEGATIVE; mark_1/mark_3 land off this at ~5.125rem / ~0.875rem, an
             accepted residual of the count-dependent asset -- calibrating on any one count always
             leaves the other two off, "do NOT trim per count" above still holds)
     battles 3.00 - 1.962 == 1.038rem
   Kept to 3 decimal places (matching this file's existing 4/3 twins elsewhere); margin is a plain
   horizontal length with no (rowHeight-box)/2 quantisation to land on, so unlike a BOX these
   values carry no whole-rem/whole-device-pixel requirement -- they are calibrated off a
   continuously-measured asset bbox, so at least one of the two interface/size modes will always
   land on a sub-device-pixel offset regardless of rounding; the residual is well under a rem and
   is the same class of accepted drift as .mpv-capC's own quarter-rem residual elsewhere in this
   file. Compound three-class selectors (`.mpv-cap .mpv-ico.<class>`, specificity (0,3,0)) beat the
   shared `.mpv-cap .mpv-ico { margin-left: 1rem; }` base rule (0,2,0) OUTRIGHT, the same
   convention the mark icon's own correction already used here -- not by source order.
   SOURCE ORDER IS STILL LOAD-BEARING for the ::before pair below, though the row split retires
   part of the old hazard: `.mpv-capR .mpv-ico::before` (above) no longer matches the battles
   glyph at all now that it lives in `.mpv-capEta`, not `.mpv-capR` -- so the dark-drop/gold race
   this rule pair used to run on that ONE icon is gone for the vertical bar. The pair itself
   stays (it still governs the MARK icon, which is still inside `.mpv-capR`) and the horizontal
   sheet's OWN identical pair (`.mp-capR .mp-ico::before` / `.mp-ico.battles::before`,
   MoEProgress.css) is UNCHANGED and still order-dependent exactly as before. */
.mpv-cap .mpv-ico.dmgp { margin-left: 1.253rem; }
.mpv-cap .mpv-ico.moe { margin-left: 0.885rem; }
.mpv-cap .mpv-ico.mk { margin-left: -1.25rem; }
.mpv-cap .mpv-ico.mk1 { margin-left: 0.500rem; }
.mpv-cap .mpv-ico.mk2 { margin-left: 2.000rem; }
.mpv-cap .mpv-ico.mk3 { margin-left: 4.000rem; }
.mpv-cap .mpv-ico.battles { margin-left: 1.038rem; }
.mpv-ico.battles::before {
  background: radial-gradient(circle at 50% 50%, rgba(255,205,90,0.5) 0%, transparent 73%);
}
.mpv-ico.battles::after {
  background-image: url(img://gui/maps/icons/personal_missions_30/quest_type/128x128/icon_battle_condition_battles.png);
  background-size: 331.0%;
  filter: brightness(3);
}
.mpv-ico.none { display: none; }
#moe-bar-root.mpv-full .mpv-track,
#moe-bar-root.mpv-full .mpv-fill,
#moe-bar-root.mpv-full .mpv-tick {
  box-shadow: 0 0 8rem rgba(255,205,90,0.5);
}
#moe-bar-root.mpv-full .mpv-fill {
  background: rgba(255,205,90,0.8);
}
#moe-bar-root.mpv-full .mpv-v {
  text-shadow: 0rem 0rem 1rem rgba(0,0,0,0.5),
               0 0 8rem rgba(255,205,90,0.5),
               0 0 2rem rgba(255,205,90,0.5);
}
@keyframes mpv-life {
    0% { opacity: 0; transform: translateY(20rem); animation-timing-function: ease-in; }
  9.68% { opacity: 1; transform: translateY(0rem); animation-timing-function: linear; }
  90.32% { opacity: 1; transform: translateY(0rem); animation-timing-function: ease-in; }
  100% { opacity: 0; transform: translateY(20rem); }
}
#moe-bar-root.mpv-run { animation: mpv-life 6200ms both; }

<style>
*{box-sizing:border-box;}
body{
  margin:0; padding:20px 24px 60px; background:#14161a; color:#e7e7e7;
  font:14px/1.4 -apple-system,Segoe UI,Arial,sans-serif;
}
h1{font-size:18px;margin:0 0 4px;}
.sub{color:#9aa;margin:0 0 18px;font-size:12.5px;}
.statebar{
  display:flex; gap:18px; align-items:center; background:#1d2026; border:1px solid #333a44;
  border-radius:8px; padding:12px 16px; margin-bottom:18px; flex-wrap:wrap;
}
.statebar label{display:flex; flex-direction:column; gap:4px; font-size:12px; color:#aab; }
.statebar select{background:#0f1114;color:#e7e7e7;border:1px solid #444c58;border-radius:5px;padding:5px 8px;font-size:13px;}
.statebar .comp-file{margin-left:auto; font-size:12px; color:#8fe3a0;}
#rows{display:flex; flex-direction:column; gap:14px;}
.row{
  background:#1a1c21; border:1px solid #30353d; border-radius:8px; padding:12px 14px;
}
.row h3{margin:0 0 8px; font-size:14px; display:flex; align-items:center; gap:8px;}
.controls{display:flex; gap:14px; flex-wrap:wrap; margin-bottom:10px;}
.ctl{display:flex; flex-direction:column; gap:3px; font-size:11.5px; color:#9aa;}
.ctl input[type=number]{width:74px; background:#0f1114;color:#e7e7e7;border:1px solid #444c58;border-radius:4px;padding:4px 6px;font-size:12.5px;}
.ctl select{background:#0f1114;color:#e7e7e7;border:1px solid #444c58;border-radius:4px;padding:4px 6px;font-size:12.5px;}
.ctl input[type=range]{width:110px;}
.readout{display:flex; gap:18px; align-items:baseline; margin-bottom:10px; font-size:12.5px;}
.readout b{font-size:17px;}
.gapbadge{padding:2px 10px; border-radius:12px; font-size:11.5px; font-weight:600;}
.gapbadge.ok{background:#25401f; color:#8fe3a0;}
.gapbadge.off{background:#402525; color:#e39a8f;}
.preview{
  background:#0b0c0e; border-radius:6px; padding:10px 12px;
  min-height:64px; overflow:visible;
}
/* ---- markline: mark_1/mark_2/mark_3 side by side, one line, own controls+readout each ---- */
.markline-ctls{display:flex; gap:18px; flex-wrap:wrap; margin-bottom:10px;}
.markline-preview{display:flex; gap:18px; flex-wrap:wrap;}
.markline-col{display:flex; flex-direction:column; gap:6px;}
.markline-label{font-size:11.5px; color:#8fe3a0; font-weight:600;}
#preview-shift{position:relative; overflow:visible;}
</style>

<script>
"use strict";
var CSS_MP = "/* MoEProgress.css -- in-battle centre-screen MoE progress bar. Tuned in the browser\n   (tools/dev/gen_bar_tuner.ps1) and copied VERBATIM; the battle window has no hot-reload.\n   Position comes from Python (window.move()), NOT from CSS -- tuner stage placement was\n   top 85vh, centre offset 0rem. Font: the bundled MoEBattle numeric subset,\n   19 glyphs (digits % ( ) + - , . / space) -- NO LETTERS, a word label renders blank.\n   Sizes in rem (1rem == 1 logical px); colours by VALUE (Gameface drops a declaration\n   whose var() cannot resolve). JS sets .mp-fill width and the .mp-proj / .mp-capC left as\n   percentages, and toggles .mp-up/.mp-down on the fill + the bottom numerals. The axis-end\n   caption is pure CSS (it hangs off the track's right end), so JS measures nothing. */\n\n/* ADDITION 1 OF 2 TO THE TUNER'S EMITTED FILE. #moe-bar-root asks for font-family \"MoEBattle\"\n   but the tuner ran in a browser and never emitted a face for it, and this document does NOT\n   <link> MoEBattle.css (that would drag the whole corner overlay's rules in with it). So the\n   6-line declaration is copied verbatim from MoEBattle.css:23-29 -- same family name, same\n   single weight-600 cut, same bare-sibling url FIRST: Coherent resolves an @font-face src\n   against the DOCUMENT directory only, so a subdir-relative path silently falls back to Arial\n   Narrow. That is also why this file must sit right beside MoEBattle.ttf and checker.png. */\n@font-face {\n    font-family: \"MoEBattle\";\n    font-weight: 600;\n    font-style: normal;\n    src: url(MoEBattle.ttf) format(\"truetype\"),\n         url(\"coui://gui/gameface/mods/14th_ua/MoECalculator/MoEBattle.ttf\") format(\"truetype\");\n}\n\n/* ADDITION 2 OF 2 TO THE TUNER'S EMITTED FILE (not tuned, no tuned value touched) -- THE SIZING\n   SHIM. #moe-bar-root is position:absolute and therefore contributes ZERO content size, so with an\n   empty body the engine's size calculation has nothing to measure: it t
