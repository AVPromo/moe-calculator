// ---- extraction: read a literal number straight out of the copied CSS text, never hand-typed.
// Anchored to the START OF A LINE so a short selector (".mp-ico.mk") never matches as a trailing
// substring of a longer one (".mp-cap .mp-ico.mk") a few lines away. ----
function escRe(s){ return s.replace(/[-[\]{}()*+?.,\\^$|#\s]/g, "\\$&"); }
function ruleDecl(css, selectorLiteral){
  selectorLiteral = selectorLiteral.replace(/\s*\{\s*$/, "");
  var re = new RegExp("(^|\\n)" + escRe(selectorLiteral) + "\\s*\\{");
  var m = css.match(re);
  if (!m) throw new Error("selector not found (line-anchored) in copied CSS: " + selectorLiteral);
  var i = m.index + m[1].length;
  var b0 = css.indexOf("{", i), b1 = css.indexOf("}", b0);
  if (b0 < 0 || b1 < 0) throw new Error("malformed rule for " + selectorLiteral);
  return css.slice(b0 + 1, b1);
}
function numOf(decl, prop){
  var m = decl.match(new RegExp(escRe(prop) + "\\s*:\\s*(-?[\\d.]+)"));
  if (!m) throw new Error("property not found: " + prop + " in `" + decl + "`");
  return parseFloat(m[1]);
}
function yFromDecl(decl){
  var m = decl.match(/translateY\(\s*(-?[\d.]+)rem\s*\)/);
  if (m) return parseFloat(m[1]);
  var m2 = decl.match(/translate\(\s*-?[\d.]+rem\s*,\s*(-?[\d.]+)rem\s*\)/);
  if (m2) return parseFloat(m2[1]);
  throw new Error("no translateY in `" + decl + "`");
}
function xFromDecl(decl){
  var m = decl.match(/translate\(\s*(-?[\d.]+)rem\s*,/);
  if (!m) throw new Error("no translate(x,...) in `" + decl + "`");
  return parseFloat(m[1]);
}
function sumTranslateX(decl){
  var re = /translateX\(\s*(-?[\d.]+)rem\s*\)/g, m, total = 0;
  while ((m = re.exec(decl))) total += parseFloat(m[1]);
  return total;
}

// ---- SIZE + MARK cascade. The shipped CSS now carries real per-mark rules (mk1/mk2/mk3, or
// r1/r2/r3 for DE's block-gap) AND real .mp-lg-prefixed Large twins for most of them -- but not
// all: some knobs have no Large twin at all (still the Default number under Large) and some
// have no PER-MARK twin either (one shared value across all three marks). ruleDecl() is a literal
// line-anchored text search, so it can't see the cascade itself -- this tries the most specific
// selector first and falls back exactly the way the browser's OWN cascade would if the more
// specific rule didn't exist: Large+mark -> Large shared -> Default+mark -> Default shared.
// candidateSels' RESULT is returned by resolveDecl too (as `.sels`) so callers can report which
// tier actually matched -- see renderControls' fallback footnote. ----
function candidateSels(bareSel, markSuffix, sz){
  var withMark = markSuffix ? (bareSel + markSuffix) : null;
  var large = sz === "lg";
  var out = [];
  if (large && withMark) out.push(".mp-lg " + withMark);
  if (large) out.push(".mp-lg " + bareSel);
  if (withMark) out.push(withMark);
  out.push(bareSel);
  return out;
}
// `extractFn` (e.g. numOf-bound-to-a-prop, or xFromDecl/yFromDecl) is what actually decides a
// tier is USABLE: a more-specific selector CAN legitimately exist for a DIFFERENT property than
// the one being resolved (e.g. Large's `.mp-capC .mp-ico` rule overrides margin-left only, to
// cancel the icon's width on the two centre captions -- its own Y-nudge is untouched and still
// lives on the base rule). Accepting the first SELECTOR match regardless of whether it carries
// the property being asked for would silently resolve the wrong value; only a tier whose decl
// text lets extractFn succeed counts as a real match, so a property-only Large override is
// skipped in favour of the next (correct) tier, never mistaken for "the Large Y-nudge".
function resolveDecl(css, bareSel, markSuffix, sz, extractFn){
  var sels = candidateSels(bareSel, markSuffix, sz);
  for (var i = 0; i < sels.length; i++){
    var decl;
    try { decl = ruleDecl(css, sels[i]); } catch (e) { continue; }
    try { return { decl: decl, val: extractFn(decl), sel: sels[i], tier: i, sels: sels }; } catch (e) { continue; }
  }
  throw new Error("no usable rule found for any of: " + sels.join(", "));
}

// ---- per-composition metadata: WHICH property carries the lever (mechanism, confirmed against
// source, never wrong across this whole thread -- unlike the anchor geometry it replaced) plus
// the exact selectors to extract from and to hide. Every NUMBER below comes from extraction at
// mount time, not from this table. ----
// blockSel/blockGapProp/blockGapTemplate: the SECOND per-mark knob -- the gap between the
// (icon+number) CAP and the bar/track it hangs off, as opposed to leverProp/leverKind above
// (icon<->number, within the cap). "transform" reconstructs the cap's whole transform from a
// single tunable rem value (line-anchored ruleDecl() can't see the cascade, so -- same limitation
// box/lever/Y already have -- Large mode seeds from the Default rule's literal text).
var COMP = {
  ma_h: { css:function(){return CSS_MP;}, other:function(){return CSS_EFF;},
          markup:MARKUP_MA_H, leverProp:"marginRight", leverKind:"margin",
          markSel:".mp-ico", markBoxSel:".mp-ico.mk", markLeverSel:".mp-cap .mp-ico.mk", markYSel:".mp-capR .mp-ico",
          refSel:".mp-ico.dmgc", refBoxSel:".mp-ico.dmgc", refLeverSel:".mp-cap .mp-ico", refYSel:".mp-capC .mp-ico",
          hide:[".mp-capP",".mp-capC"], hideWithin:[[".mp-capR",".mp-ico.battles"],[".mp-capR",".mp-eta"]],
          markGlyphHost:".mp-capR .mp-ico", numeralSel:".mp-capR .mp-v",
          blockSel:".mp-cap.side.mp-capR", blockGapProp:"marginLeft",
          // Tight clone canvas, not the 900x650 "big enough for anything" placeholder: sized off
          // this composition's OWN .mp-backdrop bleed (left:-80rem/-106.667rem large, top:-34rem)
          // and #moe-bar-box (380rem/500rem large x 92rem) + capR's own right-hand overhang, each
          // padded by wrapOffset on every side so nothing clips. wrapOffset replaces the flat
          // 160rem placement shift for the SAME reason -- just no longer overshooting it.
          wrapOffset:110, wrapW:680, wrapH:230 },
  ma_v: { css:function(){return CSS_MPV;}, other:function(){return CSS_MEV;},
          markup:MARKUP_MA_V, leverProp:"marginLeft", leverKind:"margin",
          markSel:".mpv-ico", markBoxSel:".mpv-ico.mk", markLeverSel:".mpv-cap .mpv-ico.mk", markYSel:".mpv-capR .mpv-ico",
          refSel:".mpv-ico.dmgc", refBoxSel:".mpv-ico.dmgc", refLeverSel:".mpv-cap .mpv-ico", refYSel:".mpv-capC .mpv-ico",
          hide:[".mpv-capP",".mpv-capC",".mpv-capEta"], hideWithin:[],
          markGlyphHost:".mpv-capR .mpv-ico", numeralSel:".mpv-capR .mpv-v",
          blockSel:".mpv-capR", blockGapProp:"transform", blockGapTemplate:"translateX({X}rem)",
          wrapOffset:100, wrapW:400, wrapH:440 },
  de_h: { css:function(){return CSS_EFF;}, other:function(){return CSS_MP;},
          markup:MARKUP_DE_H, leverProp:"transform", leverKind:"transform-x-fixed50",
          markSel:".mp-ico", markBoxSel:".mp-ico.mk", markLeverSel:".mp-cap.dn .mp-ico.mk", markYSel:".mp-cap.dn .mp-ico.mk",
          refSel:".mp-ico.dmg", refBoxSel:".mp-ico.dmg", refLeverSel:".mp-cap.up .mp-ico", refYSel:".mp-cap.up .mp-ico",
          hide:[".mp-cap.r4",".mp-capC"], hideWithin:[],
          rows:["r1","r2","r3"], numeralSel:".mp-v", capPrefix:"mp-cap",
          blockSel:".mp-cap.dn", blockGapProp:"marginTop",
          wrapOffset:110, wrapW:640, wrapH:230 },
  de_v: { css:function(){return CSS_MEV;}, other:function(){return CSS_MPV;},
          markup:MARKUP_DE_V, leverProp:"marginLeft", leverKind:"margin",
          markSel:".mev-ico", markBoxSel:".mev-ico.mk", markLeverSel:".mev-cap .mev-ico.mk", markYSel:".mev-cap.lf .mev-ico",
          refSel:".mev-ico.dmg", refBoxSel:".mev-ico.dmg", refLeverSel:".mev-cap .mev-ico", refYSel:".mev-cap.bt .mev-ico",
          hide:[".mev-cap.r4",".mev-capC"], hideWithin:[],
          rows:["r1","r2","r3"], numeralSel:".mev-v", capPrefix:"mev-cap",
          blockSel:".mev-cap.lf", blockGapProp:"transform", blockGapTemplate:"translateY(50%) translateX({X}rem)",
          wrapOffset:90, wrapW:190, wrapH:480 }
};

// ---- ink-gap math (UNCHANGED from every prior pass -- never the source of a bug). Alpha>32
// bbox measurements, GLYPHS table pared to what's still on screen: the "damage" quest_type icon
// (the hidden reference) and the three marksOnGun cuts. ----
var GLYPHS = {
  damage: {canvas:128, bboxW:28, contain:false},
  mark_1: {canvas:24, bboxW:6, contain:true},
  mark_2: {canvas:24, bboxW:12, contain:true},
  mark_3: {canvas:24, bboxW:18, contain:true}
};
function inkX(box, bgPct, glyphKey){
  var g = GLYPHS[glyphKey];
  if (g.contain) return box * (g.bboxW / g.canvas);
  return (g.bboxW / g.canvas) * (bgPct / 100) * box;
}
function computeGap(box, lever, glyphKey, bgPct, xneg){
  var ink = inkX(box, bgPct, glyphKey);
  var inset = (box - ink) / 2;
  var gap = xneg ? (inset - lever) : (lever + inset);
  return {ink:ink, inset:inset, gap:gap};
}

// ---- extract every tunable + reference number out of the ACTIVE bar's own copied CSS text.
// Runs once per Bar switch; throws loudly (not silently) if a selector ever stops matching. ----
// numOf/xFromDecl/yFromDecl applied to whichever tier resolveDecl found -- box/lever/Y/gap2
// each resolve INDEPENDENTLY (a mark can get its lever from the Large-per-mark rule while its
// box still falls back to Default-shared, since box has no Large or per-mark twin anywhere).
function markSuffixFor(n){ return "" + n; }               // icon-level (box/lever/Y): ".mk" + N
function blockSuffixFor(c, n){                              // cap-level (gap2): "mkN" for MA (a
  return (c.rows ? ".r" + n : ".mk" + n);                    // class-swapped single node), "rN" for
}                                                             // DE (a real per-row DOM node).

function seedMark(ck, gk, sz){
  var c = COMP[ck], css = c.css();
  var n = gk === "mark_2" ? 2 : gk === "mark_3" ? 3 : 1;
  var mkN = markSuffixFor(n);

  var leverProp = c.leverProp === "marginLeft" ? "margin-left" : "margin-right";
  var blockProp = c.blockGapProp === "marginLeft" ? "margin-left" : "margin-top";

  var boxR = resolveDecl(css, c.markBoxSel, mkN, sz, function(d){ return numOf(d, "width"); });

  var lever, y, leverR, yR;
  if (c.leverKind === "transform-x-fixed50"){
    leverR = resolveDecl(css, c.markLeverSel, mkN, sz, xFromDecl);
    lever = leverR.val;
    yR = resolveDecl(css, c.markYSel, mkN, sz, yFromDecl); // same selector as lever for this
    y = yR.val;                                             // leverKind (de_h), resolved separately
  } else {                                                   // so a property-only tier miss on ONE
    leverR = resolveDecl(css, c.markLeverSel, mkN, sz, function(d){ return numOf(d, leverProp); });
    lever = leverR.val;
    yR = resolveDecl(css, c.markYSel, mkN, sz, yFromDecl);
    y = yR.val;
  }

  var gap2Suffix = blockSuffixFor(c, n);
  var gap2R = resolveDecl(css, c.blockSel, gap2Suffix, sz,
    c.blockGapProp === "transform" ? sumTranslateX : function(d){ return numOf(d, blockProp); });
  var gap2 = gap2R.val;

  return {
    box:boxR.val, lever:lever, y:y, gap2:gap2,
    tiers: { box:boxR.tier, lever:leverR.tier, y:yR.tier, gap2:gap2R.tier },
    sels:  { box:boxR.sel,  lever:leverR.sel,  y:yR.sel,  gap2:gap2R.sel }
  };
}

function seedRef(ck, sz){
  var c = COMP[ck], css = c.css();
  var leverProp = c.leverProp === "marginLeft" ? "margin-left" : "margin-right";
  var box = resolveDecl(css, c.refBoxSel, null, sz, function(d){ return numOf(d, "width"); }).val;
  var bg = resolveDecl(css, c.refSel + "::after", null, sz, function(d){ return numOf(d, "background-size"); }).val;
  var lever, y;
  if (c.leverKind === "transform-x-fixed50"){
    lever = resolveDecl(css, c.refLeverSel, null, sz, xFromDecl).val;
    y = resolveDecl(css, c.refYSel, null, sz, yFromDecl).val;
  } else {
    lever = resolveDecl(css, c.refLeverSel, null, sz, function(d){ return numOf(d, leverProp); }).val;
    y = resolveDecl(css, c.refYSel, null, sz, yFromDecl).val;
  }
  return {box:box, lever:lever, y:y, bg:bg};
}

// ---- live, editable, INDEPENDENT per-mark state -- seeded from extraction, one object per
// (composition, mark, size). Large is seeded from its OWN rules where the shipped CSS has them
// (per-mark .mp-lg twin, or failing that a size-only shared .mp-lg twin) and falls back to the
// Default row's own resolution only where NEITHER Large twin exists -- see seedMark's `tiers`
// (0=Large+mark, 1=Large shared, 2=Default+mark, 3=Default shared), surfaced in renderControls. ----
var ST = {};
function seedState(ck, sz){
  var large = sz === "lg";
  document.body.classList.toggle("mp-lg", large);
  ["mark_1","mark_2","mark_3"].forEach(function(gk){
    var key = ck + "|" + gk + "|" + sz;
    if (!ST[key]) {
      var m = seedMark(ck, gk, sz);
      ST[key] = {box:m.box, lever:m.lever, y:m.y, gap2:m.gap2, _tiers:m.tiers, _sels:m.sels};
    }
  });
  var refKey = ck + "|ref|" + sz;
  if (!ST[refKey]) {
    var r = seedRef(ck, sz);
    ST[refKey] = {box:r.box, lever:r.lever, y:r.y, bg:r.bg};
  }
}

function rootFontPx(sz){ return sz === "lg" ? 1.25 : 1; }
function compKey(){ return document.getElementById("selBar").value + "_" + document.getElementById("selOrient").value; }
function sizeKey(){ return document.getElementById("selSize").value; }
function zoomVal(){ return parseFloat(document.getElementById("selZoom").value) || 1; }

function applyIconStyle(el, c, box, lever, y){
  el.style.width = box + "rem"; el.style.height = box + "rem";
  if (c.leverKind === "transform-x-fixed50"){
    el.style.transform = "translate(" + lever + "rem, -50%) translateY(" + y + "rem)";
  } else {
    el.style[c.leverProp] = lever + "rem";
    el.style.transform = "translateY(" + y + "rem)";
  }
}
function applyBlockGap(el, c, val){
  if (!el) return;
  if (c.blockGapProp === "transform") el.style.transform = c.blockGapTemplate.replace("{X}", val);
  else el.style[c.blockGapProp] = val + "rem";
}
function buildBarRoot(c){
  var root = document.createElement("div");
  root.id = "moe-bar-root";
  root.innerHTML = c.markup;
  // shifted off the clone's own edge by wrapOffset (per-context, sized off the composition's
  // OWN backdrop bleed -- see COMP) so the backdrop's negative bleed has room without the
  // clone reserving far more canvas than its ink needs.
  root.style.left = c.wrapOffset + "rem"; root.style.top = c.wrapOffset + "rem";
  c.hide.forEach(function(sel){ var el = root.querySelector(sel); if (el) el.style.display = "none"; });
  (c.hideWithin || []).forEach(function(pair){
    var host = root.querySelector(pair[0]);
    if (host) { var el = host.querySelector(pair[1]); if (el) el.style.display = "none"; }
  });
  return root;
}

function mount(){
  var ck = compKey(), sz = sizeKey(), zoom = zoomVal(), bar = ck.split("_")[0], orient = ck.split("_")[1];
  var c = COMP[ck];
  document.documentElement.style.fontSize = rootFontPx(sz) + "px";
  document.body.classList.toggle("mpv", ck === "ma_v");
  document.body.classList.toggle("mev", ck === "de_v");
  ["css-mp","css-mpv","css-eff","css-mev"].forEach(function(id){ document.getElementById(id).disabled = true; });
  (bar === "ma" ? ["css-mp","css-mpv"] : ["css-eff","css-mev"]).forEach(function(id){ document.getElementById(id).disabled = false; });
  seedState(ck, sz);
  document.getElementById("compFile").textContent =
    (bar === "ma" ? "MoEProgress.css + MoEProgressVertical.css" : "MoEEfficiency.css + MoEEfficiencyVertical.css") +
    "  |  body classes: " + document.body.className;

  var shift = document.getElementById("preview-shift");
  shift.innerHTML = "";
  var markIcons = []; // {el, capEl, numeralEl, glyph}

  if (c.rows){
    // DE: r1/r2/r3 are already separate real nodes at their own real percentages -- one root,
    // no cloning.
    var zoomBox = document.createElement("div");
    zoomBox.style.transform = "scale(" + zoom + ")";
    zoomBox.style.transformOrigin = "top left";
    var root = buildBarRoot(c);
    zoomBox.appendChild(root);
    shift.appendChild(zoomBox);
    shift.style.display = ""; shift.style.flexDirection = ""; shift.style.gap = "";
    shift.style.width = (c.wrapW * zoom * rootFontPx(sz)) + "px";
    shift.style.height = (c.wrapH * zoom * rootFontPx(sz)) + "px";
    c.rows.forEach(function(row, i){
      // QUALIFIED, not a bare "." + row: the tick (".mp-tick.mp-req.r1"/".mev-tick.mev-req.r1")
      // shares the same bare rN class and sits FIRST in document order, so an unqualified
      // querySelector(".r1") silently resolves to the empty tick, not the caption -- the exact
      // trap the copied CSS's own comment warns about for selectors, just missed here in JS.
      var cap = root.querySelector("." + c.capPrefix + "." + row);
      markIcons.push({ el: cap.querySelector(c.markSel + ".mk"), capEl: cap, numeralEl: cap.querySelector(c.numeralSel), glyph: "mark_" + (i + 1) });
    });
  } else {
    // MA: the real bar has ONE mark-icon slot (setIco() reassigns its class wholesale), so a
    // per-requirement view needs THREE separate bar instances -- one per mark, each a full clone
    // of the real markup/CSS with its own mk1/mk2/mk3 class baked in (never all three at once on
    // one real node). Stacked in a column (horizontal bars) or a row (vertical bars).
    shift.style.display = "flex";
    shift.style.flexDirection = orient === "h" ? "column" : "row";
    shift.style.gap = "4px";
    shift.style.width = ""; shift.style.height = "";
    ["mark_1","mark_2","mark_3"].forEach(function(gk, i){
      var zoomBox = document.createElement("div");
      zoomBox.style.position = "relative";
      zoomBox.style.width = (c.wrapW * zoom * rootFontPx(sz)) + "px";
      zoomBox.style.height = (c.wrapH * zoom * rootFontPx(sz)) + "px";
      zoomBox.style.transform = "scale(" + zoom + ")";
      zoomBox.style.transformOrigin = "top left";
      var root = buildBarRoot(c);
      var host = root.querySelector(c.markGlyphHost);
      host.className = c.markSel.replace(".", "") + " mk mk" + (i + 1);
      zoomBox.appendChild(root);
      shift.appendChild(zoomBox);
      markIcons.push({ el: host, capEl: root.querySelector(c.blockSel), numeralEl: root.querySelector(c.numeralSel), glyph: gk });
    });
  }

  markIcons.forEach(function(mi){
    var st = ST[ck + "|" + mi.glyph + "|" + sz];
    applyIconStyle(mi.el, c, st.box, st.lever, st.y);
    applyBlockGap(mi.capEl, c, st.gap2);
    if (mi.numeralEl) mi.numeralEl.textContent = "888";
  });

  renderControls(ck, sz, c, markIcons);
  renderBanners(ck, sz, c);
}

function renderBanners(ck, sz, c){
  var refSt = ST[ck + "|ref|" + sz];
  var refGap = computeGap(refSt.box, refSt.lever, "damage", refSt.bg, c.leverKind === "transform-x-fixed50").gap;
  document.getElementById("refBanner").innerHTML = "<b>Reference gap: " + refGap.toFixed(3) + "rem</b>";
}

// tier: 0 Large+mark, 1 Large shared, 2 Default+mark, 3 Default shared (total fallback) --
// see resolveDecl. Only tiers 1/3 (no Large-specific rule at all) get a footnote; 0/2 are each
// composition's real, size-correct rule and need no caveat.
var TIER_NOTE = ["", " (Large: shared, no per-mark rule)", "", " (no Large rule -- Default value)"];
function numCtl(label, value, step, onchange, disabled, tier){
  var wrap = document.createElement("div"); wrap.className = "ctl";
  var lab = document.createElement("label"); lab.textContent = label + (tier != null ? TIER_NOTE[tier] : "");
  var inp = document.createElement("input"); inp.type = "number"; inp.step = step; inp.value = value;
  if (disabled) inp.disabled = true;
  inp.addEventListener("input", function(){ onchange(parseFloat(inp.value)); mount(); });
  wrap.appendChild(lab); wrap.appendChild(inp);
  return wrap;
}

function renderControls(ck, sz, c, markIcons){
  var ctlsRow = document.getElementById("ctlsRow");
  ctlsRow.innerHTML = "";
  ["mark_1","mark_2","mark_3"].forEach(function(gk){
    var st = ST[ck + "|" + gk + "|" + sz];
    var col = document.createElement("div"); col.className = "markline-col";
    var lab = document.createElement("div"); lab.className = "markline-label"; lab.textContent = gk;
    col.appendChild(lab);
    var grp = document.createElement("div"); grp.className = "controls";
    var t = st._tiers || {};
    var showTier = sz === "lg"; // Default's own tiers (2/3) are the normal case, no footnote needed
    grp.appendChild(numCtl("box (w=h, rem)", st.box, "0.1", function(v){ st.box = v; }, false, showTier ? t.box : null));
    grp.appendChild(numCtl("background-size", "contain (fixed)", "1", function(){}, true));
    grp.appendChild(numCtl("icon<->number gap (rem)", st.lever, "0.001", function(v){ st.lever = v; }, false, showTier ? t.lever : null));
    grp.appendChild(numCtl("Y nudge (rem)", st.y, "0.05", function(v){ st.y = v; }, false, showTier ? t.y : null));
    grp.appendChild(numCtl("block<->bar gap (rem)", st.gap2, "0.05", function(v){ st.gap2 = v; }, false, showTier ? t.gap2 : null));
    col.appendChild(grp);
    var r = computeGap(st.box, st.lever, gk, 0, false);
    var refSt = ST[ck + "|ref|" + sz];
    var refGap = computeGap(refSt.box, refSt.lever, "damage", refSt.bg, c.leverKind === "transform-x-fixed50").gap;
    var match = Math.abs(r.gap - refGap) < 0.05;
    var readout = document.createElement("div"); readout.className = "readout";
    readout.innerHTML = "ink " + r.ink.toFixed(3) + "rem &nbsp; inset " + r.inset.toFixed(3) + "rem &nbsp; <b>gap " + r.gap.toFixed(3) + "rem</b>";
    var badge = document.createElement("span"); badge.className = "gapbadge " + (match ? "ok" : "off");
    badge.textContent = match ? "MATCHES reference" : "off by " + (r.gap - refGap).toFixed(3) + "rem";
    readout.appendChild(badge);
    col.appendChild(readout);
    ctlsRow.appendChild(col);
  });
}

document.getElementById("selBar").addEventListener("change", mount);
document.getElementById("selOrient").addEventListener("change", mount);
document.getElementById("selSize").addEventListener("change", mount);
document.getElementById("selZoom").addEventListener("change", mount);
document.getElementById("btnEmit").addEventListener("click", function(){
  var ck = compKey(), sz = sizeKey(), c = COMP[ck];
  var out = ["STATE: " + ck.toUpperCase() + " / " + (sz === "lg" ? "Large" : "Default"), ""];
  (c.rows || ["mark_1","mark_2","mark_3"]).forEach(function(rowOrGk, i){
    var gk = c.rows ? "mark_" + (i + 1) : rowOrGk;
    var st = ST[ck + "|" + gk + "|" + sz];
    out.push("-- " + gk + " --");
    out.push("  box " + st.box + "rem, icon<->number gap " + st.lever.toFixed(3) + "rem, Y " + st.y +
              "rem, block<->bar gap " + st.gap2.toFixed(3) + "rem");
  });
  document.getElementById("emitOut").value = out.join("\n");
});

mount();
</script>
</body>
