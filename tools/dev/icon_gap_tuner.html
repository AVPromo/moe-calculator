me defect): a shrink-wrapped box\n   centred via left:50%+translateX(-50%) never gives any child a truly fixed screen position\n   (both its edges move as content width changes), so all THREE captions now share ONE fixed\n   right edge -- right:100%+left:auto, pinned to the track's own left edge -- clear of the\n   tick's outer-edge overhang via the shared padding-right below. Numeral-then-icon DOM order\n   means each caption's icon is the LAST in-flow child, so it sits flush against that fixed\n   edge and is provably invariant to digit count. Only the numeral (and capC's delta, hanging\n   off ITS left edge) grows/shrinks LEFTWARD, away from the anchor. capP is also the ONLY one\n   that moves, tracking the pre tick's `bottom` -- and like that tick it never animates within\n   one replay, so no transition is declared.\n   DO NOT \"OPTICALLY CENTRE\" THE ABOVE/BELOW CAPTIONS. Because they are right-anchored and grow\n   leftward, they read right-aligned against that line rather than centred over the track, and\n   their apparent gap from the track's centreline varies with digit count even though the anchor\n   never moves. Centring them needs a WIDTH-SCALED term -- which IS the bug this replaced. A\n   non-zero residual nudge is fine; a nudge whose value is a function of the caption's own content\n   width is the defect. */\n.mpv-cap {\n  position: absolute;\n  display: flex;\n  flex-direction: row;\n  align-items: center;\n  white-space: nowrap;\n  z-index: 3;\n  right: 100%;\n  left: auto;\n}\n/* Gameface drops margin on the bottom/right ANCHORED side (gameface-drops-margin-on-the-\n   anchored-side) -- padding on the bottom/right anchored sides; margin works as written on\n   capC's top:100% anchor. padding-right (shared by all three captions) also carries the\n   tick's outer-edge overhang (see the anchor comment above), so it clears the tick, not just\n   the track. */\n.mpv-capR { bottom: 100%; padding-bottom: 6rem; padding-right: 6rem;\n            transform: translateX(14rem); font-size: 14rem; line-height: 18rem; }\n/* HAND-EDIT 6/6: the ETA row, stacked directly above capR (maintainer's call: \"move the ETA on\n   top of the next mark requirement\"). Same right-anchor mechanism as capR, copied verbatim --\n   both rows shared it identically before the split. `padding-bottom: 30rem` == capR's own box\n   height (18rem line-height + 6rem padding-bottom == 24) plus a 6rem visual gap off it, the same\n   magnitude this file already uses to clear the track (capR's own 6rem, capC's 6rem). Re-derived\n   in tests/test_progress_surface_mirror.py's Y-fit test against V_BOX_TOP_REM + PAD_REM, never\n   hardcoded there. */\n.mpv-capEta { bottom: 100%; padding-bottom: 30rem; padding-right: 6rem;\n              transform: translateX(14rem); font-size: 14rem; line-height: 18rem; }\n.mpv-capC { top: 100%; margin-top: 6rem; padding-right: 6rem;\n            transform: translateX(16rem); font-size: 16rem; line-height: 20.5rem; }\n.mpv-capP { padding-right: 6rem; transform: translateY(50%) translateX(0rem);\n            font-size: 14rem; line-height: 18rem; }\n/* Icon follows its numeral (DOM order: numeral, then icon) -- gap on the icon's LEFT. */\n.mpv-cap .mpv-ico { margin-left: 1rem; }\n.mpv-cap .mpv-v,\n.mpv-cap .mpv-eta,\n.mpv-cap .mpv-d {\n  color: #ffffff;\n  font-weight: 600;\n  letter-spacing: 0em;\n  text-shadow: 0rem 0rem 1rem rgba(0,0,0,0.5);\n}\n/* Delta is an IN-FLOW flex child, ordered FIRST (delta, numeral, icon) -- an ordinary\n   margin-right gap, not an out-of-flow box hanging off a content-dependent edge (the exact\n   mechanism of the digit-count bug this fixes). */\n.mpv-cap .mpv-d {\n  margin-right: 0.35em;\n  font-size: 12rem;\n  transform: translateY(1.5rem);\n  line-height: 15.5rem;\n  opacity: 0;\n  transition: opacity 600ms cubic-bezier(.2,.8,.2,1);\n}\n.mpv-v.mpv-up,\n.mpv-d-num.mpv-up,\n.mpv-eta.mpv-up {\n  color: #ffffff;\n  text-shadow: 0rem 0rem 1rem rgba(0,0,0,0.5),\n               0rem 0rem 6rem rgba(123,236,55,0.9),\n               0rem 0rem 1rem rgba(123,236,55,0.9);\n}\n.mpv-v.mpv-down,\n.mpv-d-num.mpv-down,\n.mpv-eta.mpv-down {\n  color: #ffffff;\n  text-shadow: 0rem 0rem 1rem rgba(0,0,0,0.5),\n               0rem 0rem 6rem rgba(211,68,63,0.9),\n               0rem 0rem 1rem rgba(211,68,63,0.9);\n}\n.mpv-ico {\n  position: relative;\n  display: block;\n  flex: none;\n  width: 13rem;\n  height: 13rem;\n  transform: translate(0rem, 0rem);\n}\n.mpv-capP .mpv-ico { transform: translate(0rem, 0rem); }\n.mpv-capC .mpv-ico { transform: translate(0rem, 1rem); }\n.mpv-capR .mpv-ico { transform: translate(0rem, 0.5rem); }\n.mpv-capR .mpv-v { transform: translateY(-0.5rem); }\n/* capEta's own copy of the SAME nudge, same row line-height (18rem) -- so the identical\n   quantisation ((rowHeight-box)/2+nudge landing on a whole rem) holds for both rows. */\n.mpv-capEta .mpv-ico { transform: translate(0rem, 0.5rem); }\n.mpv-capEta .mpv-eta { transform: translateY(-0.5rem); }\n.mpv-capC .mpv-v { transform: translateY(-0.5rem); }\n.mpv-capP .mpv-v { transform: translateY(-0.5rem); }\n.mpv-ico::before {\n  content: \"\";\n  position: absolute;\n  left: 50%;\n  top: 50%;\n  z-index: -1;\n  width: 106%;\n  height: 106%;\n  transform: translate(-50%, -50%);\n  background: radial-gradient(circle at 50% 50%, rgba(255,205,90,0.5) 0%, transparent 73%);\n}\n.mpv-capR .mpv-ico::before {\n  background: radial-gradient(circle at 50% 50%, rgba(26,26,26,0.5) 0%, transparent 73%);\n}\n.mpv-ico::after {\n  content: \"\";\n  position: absolute; left: 0; top: 0; width: 100%; height: 100%;\n  background-repeat: no-repeat;\n  background-position: center;\n}\n.mpv-ico.dmgp { width: 14rem; height: 14rem; }\n.mpv-ico.dmgc { width: 16rem; height: 16rem; }\n.mpv-ico.dmgp::after {\n  background-image: url(img://gui/maps/icons/personal_missions_30/quest_type/128x128/icon_battle_condition_barrel_mark.png);\n  background-size: 228.7%;\n  filter: brightness(3);\n}\n.mpv-ico.dmgc::after {\n  background-image: url(img://gui/maps/icons/personal_missions_30/quest_type/128x128/icon_battle_condition_damage.png);\n  background-size: 342.5%;\n  filter: brightness(3);\n}\n.mpv-ico.moe { width: 17rem; height: 17rem; }\n.mpv-ico.moe::after {\n  background-image: url(img://gui/maps/icons/personal_missions_30/quest_type/128x128/icon_battle_condition_top.png);\n  background-size: 274.7%;\n  filter: brightness(3);\n}\n.mpv-ico.mk { width: 17rem; height: 17rem; }\n.mpv-ico.mk::after { background-size: contain; }\n.mpv-ico.mk1::after { background-image: url(img://gui/maps/icons/library/marksOnGun/mark_1.png); }\n.mpv-ico.mk2::after { background-image: url(img://gui/maps/icons/library/marksOnGun/mark_2.png); }\n.mpv-ico.mk3::after { background-image: url(img://gui/maps/icons/library/marksOnGun/mark_3.png); }\n/* PER-ICON MARGIN CORRECTIONS (2026-08-08 redo of the HAND-EDIT 6/6 ink-gap pass -- boxes are back\n   at their pre-039a58c sizes above: \"icon sizes must stay the same, adjust paddings individually\").\n   Every icon here is framed by a FIXED background-size, so its ink WIDTH is a fixed fraction of\n   its own box, independent of margin -- re-measured live off the real PNGs' alpha>32 bbox\n   (gui-part*.pkg), not estimated or carried over from the box-lever version:\n     dmgp    box 14, ink == 0.75*box (icoFill) == 10.505rem, inset (14-10.505)/2 == 1.747rem\n     dmgc    box 16 (REFERENCE, untouched), ink == 0.75*box == 11.988rem, inset == 2.006rem --\n             base 1rem margin already lands ~3.006rem; every other row targets this exactly\n     moe     box 17, ink == 0.75*box (icoFill, calibrated on its own wider X dimension) ==\n             12.769rem, inset (17-12.769)/2 == 2.115rem\n     mk      box 17, `background-size: contain` on a 24x24 canvas scales the WHOLE canvas by\n             box/24 (box == canvas aspect), and the pip ink's OWN width varies by mark count\n             (measured alpha>32 bbox: mark_1 6px, mark_2 12px, mark_3 18px, all of 24) -- NOT the\n             fixed icoFill ratio the other icons get, so no static margin equalises every count\n             (the code already forbids re-zooming per count above). Calibrated to mark_2\n             (12/24 == 0.5, the tuner's own default preview state): ink == 17*0.5 == 8.5rem,\n             inset (17-8.5)/2 == 4.25rem\n     battles box 13 (base .mpv-ico box, UNCHANGED), calibrated on its own TALLER dimension\n             (measured bbox 27x29 of a 128px canvas -- height, not width, hits icoFill 0.75), so\n             its WIDTH ink fraction is NOT 0.75 like the others: (27/128)*331.0% == 0.6982*box ==\n             9.077rem, inset (13-9.077)/2 == 1.962rem\n   Target ink gap == 3.00rem (dmgc's own reference) on every row; margin-left == target - inset,\n   replacing the shared 1rem outright (not adding to it):\n     dmgp    3.00 - 1.747 == 1.253rem\n     moe     3.00 - 2.115 == 0.885rem   (LESS than the shared 1rem -- moe's own ink is already\n             wide enough that less margin than the base gets it to 3.00)\n     mk      3.00 - 4.25  == -1.25rem   (mark_2's inset alone overshoots the target, so the\n             correction is NEGATIVE; mark_1/mark_3 land off this at ~5.125rem / ~0.875rem, an\n             accepted residual of the count-dependent asset -- calibrating on any one count always\n             leaves the other two off, \"do NOT trim per count\" above still holds)\n     battles 3.00 - 1.962 == 1.038rem\n   Kept to 3 decimal places (matching this file's existing 4/3 twins elsewhere); margin is a plain\n   horizontal length with no (rowHeight-box)/2 quantisation to land on, so unlike a BOX these\n   values carry no whole-rem/whole-device-pixel requirement -- they are calibrated off a\n   continuously-measured asset bbox, so at least one of the two interface/size modes will always\n   land on a sub-device-pixel offset regardless of rounding; the residual is well under a rem and\n   is the same class of accepted drift as .mpv-capC's own quarter-rem residual elsewhere in this\n   file. Compound three-class selectors (`.mpv-cap .mpv-ico.<class>`, specificity (0,3,0)) beat the\n   shared `.mpv-cap .mpv-ico { margin-left: 1rem; }` base rule (0,2,0) OUTRIGHT, the same\n   convention the mark icon's own correction already used here -- not by source order.\n   SOURCE ORDER IS STILL LOAD-BEARING for the ::before pair below, though the row split retires\n   part of the old hazard: `.mpv-capR .mpv-ico::before` (above) no longer matches the battles\n   glyph at all now that it lives in `.mpv-capEta`, not `.mpv-capR` -- so the dark-drop/gold race\n   this rule pair used to run on that ONE icon is gone for the vertical bar. The pair itself\n   stays (it still governs the MARK icon, which is still inside `.mpv-capR`) and the horizontal\n   sheet's OWN identical pair (`.mp-capR .mp-ico::before` / `.mp-ico.battles::before`,\n   MoEProgress.css) is UNCHANGED and still order-dependent exactly as before. */\n.mpv-cap .mpv-ico.dmgp { margin-left: 1.253rem; }\n.mpv-cap .mpv-ico.moe { margin-left: 0.885rem; }\n.mpv-cap .mpv-ico.mk { margin-left: -1.25rem; }\n.mpv-cap .mpv-ico.mk1 { margin-left: 0.500rem; }\n.mpv-cap .mpv-ico.mk2 { margin-left: 2.000rem; }\n.mpv-cap .mpv-ico.mk3 { margin-left: 4.000rem; }\n.mpv-cap .mpv-ico.battles { margin-left: 1.038rem; }\n.mpv-ico.battles::before {\n  background: radial-gradient(circle at 50% 50%, rgba(255,205,90,0.5) 0%, transparent 73%);\n}\n.mpv-ico.battles::after {\n  background-image: url(img://gui/maps/icons/personal_missions_30/quest_type/128x128/icon_battle_condition_battles.png);\n  background-size: 331.0%;\n  filter: brightness(3);\n}\n.mpv-ico.none { display: none; }\n#moe-bar-root.mpv-full .mpv-track,\n#moe-bar-root.mpv-full .mpv-fill,\n#moe-bar-root.mpv-full .mpv-tick {\n  box-shadow: 0 0 8rem rgba(255,205,90,0.5);\n}\n#moe-bar-root.mpv-full .mpv-fill {\n  background: rgba(255,205,90,0.8);\n}\n#moe-bar-root.mpv-full .mpv-v {\n  text-shadow: 0rem 0rem 1rem rgba(0,0,0,0.5),\n               0 0 8rem rgba(255,205,90,0.5),\n               0 0 2rem rgba(255,205,90,0.5);\n}\n@keyframes mpv-life {\n    0% { opacity: 0; transform: translateY(20rem); animation-timing-function: ease-in; }\n  9.68% { opacity: 1; transform: translateY(0rem); animation-timing-function: linear; }\n  90.32% { opacity: 1; transform: translateY(0rem); animation-timing-function: ease-in; }\n  100% { opacity: 0; transform: translateY(20rem); }\n}\n#moe-bar-root.mpv-run { animation: mpv-life 6200ms both; }\n/* THE RE-TRIGGER TWIN -- byte-identical to @keyframes mpv-life above apart from the name\n   (emitted from ONE builder, so it cannot drift). A baked fade/hold/fade keyframe cannot be\n   re-triggered in place: JS restarts the transient with remove-class -> force-reflow ->\n   re-add-class, which is UNPROVEN in Coherent/Gameface, and if the engine coalesces the\n   re-add with the run it just cancelled the restart is a NO-OP -- which, because\n   #moe-bar-root rests at opacity 0 under `both` fill, leaves the bar permanently INVISIBLE\n   after its first appearance. So the JS ALTERNATES between .mpv-run and .mpv-run-b\n   (MoEBarTransient.js RUN_CLASSES_V/RUN_NAMES_V): consecutive runs carry DIFFERENT\n   animation-names, which the engine cannot coalesce. Without this pair the vertical bar\n   cannot re-raise for a second battle event at all. */\n@keyframes mpv-life-b {\n    0% { opacity: 0; transform: translateY(20rem); animation-timing-function: ease-in; }\n  9.68% { opacity: 1; transform: translateY(0rem); animation-timing-function: linear; }\n  90.32% { opacity: 1; transform: translateY(0rem); animation-timing-function: ease-in; }\n  100% { opacity: 0; transform: translateY(20rem); }\n}\n#moe-bar-root.mpv-run-b { animation: mpv-life-b 6200ms both; }\n\n/* ===== THE \"LARGE\" SIZE MODE (mod_settings.progress_bar_size == 1). The mode is delivered\n   by the ROOT FONT SIZE (MoEBarTransient.js SIZE_F == 1.25), which IS the rem->px factor in\n   Gameface, so that one write re-lays the whole composition 1.25x and correctly leaves every\n   %, em, gradient stop and derived background-size ratio alone. What is left is the CROSS-AXIS\n   (screen-x) lengths, which must reach 5/3 total and therefore owe SIZE_XF == 4/3 ALONE on top\n   of it -- so every declaration below is an x-length and nothing else. Do NOT add a font-size,\n   a bar length, a tick thickness, a vertical gap or a keyframe here: the root font already has\n   them and restating one would DOUBLE-APPLY SIZE_F. The dash grid is a y-period on this bar\n   (0deg == \"to top\"), unlike the horizontal bar's 90deg twin, so it takes no rule either.\n   HAND-EDIT 4/6: the tuner emits this block under `.mpv-lg`; the class MoEBarTransient.applySize\n   actually writes on the body is `.mp-lg`, shared by both orientations (the SIZE flag is\n   orientation-independent), so every selector below is rewritten to it. Do not \"restore\" .mpv-lg\n   -- nothing would ever match it. */\n/* HAND-EDIT 5/6: these two are the emit's `.mpv-lg #moe-bar-root` plus the shim rule the tuner\n   never emits, both scoped `body.mpv.mp-lg` (1,2,1) so they out-specify the horizontal sheet's\n   own `.mp-lg #moe-bar-root` / `.mp-lg #moe-bar-box` (1,1,0) outright. The shim's width is\n   V_BOX_W_REM*SIZE_XF + 2*V_PAD_X_REM == 96 + 126 == 222 (only the BACKDROP half takes SIZE_XF --\n   the pad is rem-space slack for rem-sized ink and rides the root font's SIZE_F alone, which is\n   also why the logical-px surface the JS pushes is 222 * 1.25 == 277.5 -> 278); its HEIGHT is\n   unchanged (the root font carries SIZE_F on a y-length), exactly as the horizontal block's own\n   500rem twin restates width only. THIS SHIM IS DOCUMENT REM, NOT LOGICAL PX -- do not write 278\n   here, the root font supplies the 1.25. */\nbody.mpv.mp-lg #moe-bar-root { width: 4rem; }\nbody.mpv.mp-lg #moe-bar-box { width: 222rem; }\n.mp-lg .mpv-backdrop { left: -45.333rem; width: 96rem; }\n.mp-lg .mpv-tick.mpv-end { width: 12rem;\n  transform: translate(-50%, 50%) translateX(0rem); }\n.mp-lg .mpv-tick.mpv-pre { width: 12rem;\n  transform: translate(-50%, 50%) translateX(0rem); }\n.mp-lg .mpv-tick.mpv-proj { width: 12rem;\n  transform: translate(-50%, 50%) translateX(0rem); }\n.mp-lg .mpv-capR { padding-right: 8rem; transform: translateX(17rem); }\n/* HAND-EDIT 6/6's Large twin of the new capEta rule -- byte-identical to capR's own Large\n   values above, same as the Default pair. */\n.mp-lg .mpv-capEta { padding-right: 8rem; transform: translateX(17rem); }\n.mp-lg .mpv-capC { padding-right: 8rem; transform: translateX(21.333rem); }\n.mp-lg .mpv-capP { padding-right: 8rem;\n  transform: translateY(50%) translateX(0rem); }\n.mp-lg .mpv-cap .mpv-ico { margin-left: 1.333rem; }\n.mp-lg .mpv-cap .mpv-d { margin-right: 0.467em; }\n/* HAND-EDIT 6/6's Large twins of the four per-icon margin corrections above -- SIZE_XF (4/3), same\n   as the shared base's own 1rem -> 1.333rem twin, NOT SIZE_F (1.25): margin is a screen-x length\n   on this bar, same as every other x-length in this .mp-lg block. */\n.mp-lg .mpv-cap .mpv-ico.dmgp { margin-left: 1.671rem; }    /* 1.253 * 4/3 */\n.mp-lg .mpv-cap .mpv-ico.moe { margin-left: 1.180rem; }     /* 0.885 * 4/3 */\n.mp-lg .mpv-cap .mpv-ico.mk { margin-left: -1.667rem; }     /* -1.25 * 4/3 */\n.mp-lg .mpv-cap .mpv-ico.mk1 { margin-left: -1.000rem; }\n.mp-lg .mpv-cap .mpv-ico.mk2 { margin-left: 1.000rem; }\n.mp-lg .mpv-cap .mpv-ico.mk3 { margin-left: 3.000rem; }\n.mp-lg .mpv-cap .mpv-ico.battles { margin-left: 1.384rem; } /* 1.038 * 4/3 */\n\n/* Animation timings for the JS (mirrored in MoEBarTransient.js -- the VERTICAL keyframes are\n   identically tuned to the horizontal ones, which is why one set of constants serves both):\n{\n  \"fadeInMs\": 600,\n  \"holdMs\": 5000,\n  \"fadeOutMs\": 600,\n  \"totalMs\": 6200,\n  \"slideRem\": 20,\n  \"slideEasingIn\": \"ease-in\",\n  \"slideEasingOut\": \"ease-in\",\n  \"tickDelayMs\": 600,\n  \"tickDurationMs\": 600,\n  \"tickEasing\": \"cubic-bezier(.2,.8,.2,1)\",\n  \"deltaFadeMs\": 600,\n  \"deltaFadeEasing\": \"cubic-bezier(.2,.8,.2,1)\",\n  \"axisMode\": \"mark\",\n  \"windowN\": 60,\n  \"topGlyph\": \"barrel_mark\",\n  \"bottomGlyph\": \"damage\"\n}\n*/\n";
var CSS_EFF = "/* MoEEfficiency.css -- the DAMAGE EFFICIENCY in-battle bar variant. Tuned in the browser\n   (tools/dev/eff_bar_tuner.html) and copied VERBATIM; a registered battle window has NO\n   hot-reload, so every tweak in-game costs a full client relaunch.\n   AXIS: damage across the four mark requirements -- five stops [0,r65,r85,r95,r100] mapped\n   onto four visually EQUAL quarters [0,25,50,75,100], piecewise-linear and clamped. JS owns\n   the mapping (same algorithm as MoECalculator.js barX) and sets .mp-fill's width plus the\n   .mp-cur / .mp-cap.up left as percentages; the FOUR requirement ticks + caps are pure CSS at\n   a fixed 25/50/75/100%.\n   COLOUR: JS puts exactly ONE of .mp-b-w / -g / -t / -v / -au on #moe-bar-root, by which\n   requirement the damage has passed (>= is INCLUSIVE). The band drives the fill, the current\n   TOTAL's numerals and both glows (the current tick's and its glyph's) -- the numeral and glyph\n   glows are each tuned PER BAND, the two glow radii and the dark drop are shared. The current\n   tick's own line is STATIC white, so the marker reads the same at every band, and the delta\n   stays white with no glow at all.\n   Position comes from Python (window.move()), NOT from CSS -- tuner stage placement was\n   top 86.5vh, centre offset 0rem. Sizes in rem (1rem == 1 logical px);\n   colours by VALUE -- Gameface drops a declaration whose var() cannot resolve.\n   Font: the bundled MoEBattle numeric subset, 19 glyphs (digits % ( ) + - , . / space) --\n   NO LETTERS, and no thin space -- the thousands separator is a knob, tuned here to \"comma\".\n   THREE blocks are HAND-ADDED on top of this emit and must survive every re-copy: the\n   @font-face (the tuner inlines the ttf as a data: URI; the shipped file wants the bare\n   sibling url(MoEBattle.ttf)), the mp-life-b/mp-run-b keyframe twin, and the `.mp-lg`\n   LARGE size mode (the tuner has no size mode; that block is x-lengths only -- the rest of\n   the mode is a 1.25x ROOT FONT). The #moe-bar-box sizing rule below IS emitted -- do NOT\n   add a second one by hand; the size mode overrides it with a SCOPED `.mp-lg` twin. */\n\n/* ===== HAND-ADDED BLOCK 1 OF 4 (everything else in this file is the tuner's emit, VERBATIM --\n   tools/dev/emit_eff_css.js reproduces it byte-for-byte). #moe-bar-root asks for font-family\n   \"MoEBattle\" but the tuner ran in a browser and inlined the ttf as a data: URI, so the emit\n   carries no face for it; and this document does NOT <link> MoEBattle.css or MoEProgress.css\n   (both would collide on the shared #moe-bar-root / .mp-* namespace). So the declaration is\n   copied verbatim from MoEProgress.css:18-24 -- same family name, same single weight-600 cut,\n   same bare-sibling url FIRST: Coherent resolves an @font-face src against the DOCUMENT\n   directory only, so a subdir-relative path silently falls back to Arial Narrow. That is also\n   why this file must sit right beside MoEBattle.ttf and checker.png (both already shipped\n   siblings -- nothing new to copy). ===== */\n@font-face {\n    font-family: \"MoEBattle\";\n    font-weight: 600;\n    font-style: normal;\n    src: url(MoEBattle.ttf) format(\"truetype\"),\n         url(\"coui://gui/gameface/mods/14th_ua/MoECalculator/MoEBattle.ttf\") format(\"truetype\");\n}\n/* ===== END HAND-ADDED BLOCK 1 ===== */\nbody { margin: 0; }\n#moe-bar-box { width: 460rem; height: 55rem; }\n\n#moe-bar-root {\n  position: absolute;\n  left: 0;\n  top: 0;\n  /* Keep a width the 3rem dash period tiles without a truncated GAP: 300 == 3*100 + 0. A width == 1 (mod 3) ends on a half\n     gap -- move the WIDTH, never the tuned dash/gap. */\n  width: 300rem;\n  z-index: 9000;\n  pointer-events: none;\n  text-align: center;\n  font-family: \"MoEBattle\", \"Arial Narrow\", sans-serif;\n  opacity: 0;\n}\n.mp-backdrop {\n  position: absolute;\n  left: -80rem;\n  top: -40rem;\n  width: 460rem;\n  height: 96rem;\n  z-index: 0;\n}\n/* checker.png + MoEBattle.ttf sit RIGHT BESIDE this file -- Coherent resolves a bare url\n   against the DOCUMENT directory only. The tuner previewed THIS EXACT tile, inlined as a\n   data: URI -- the same 4px PNG, 2x2 cells @2px (tools/dev/gen_checker.py). */\n.mp-backdrop::before {\n  content: \"\";\n  position: absolute; left: 0; top: 0; width: 100%; height: 100%;\n  background: url(checker.png) repeat;\n  background-size: auto;\n  image-rendering: pixelated;\n  opacity: 0.1;\n  mask: radial-gradient(56% 110% at 50% 50%,#000 0%,transparent 67%);\n}\n.mp-backdrop::after {\n  content: \"\";\n  position: absolute; left: 0; top: 0; width: 100%; height: 100%;\n  z-index: -1;\n  background: radial-gradient(76% 57% at 50% 50%,rgba(0,0,0,0.35) 0%,rgba(0,0,0,0) 70%);\n}\n.mp-track {\n  position: relative;\n  z-index: 1;\n  width: 100%;\n  height: 3rem;\n  background: rgba(0,0,0,0.45);\n}\n/* THE DASH GRID MASKS THE FILL: 2rem dash + 1rem OPAQUE gap, ONE period in the gradient\n   tiled by background-size (WG's own idiom). The gap must stay opaque -- at a lower alpha the\n   fill shows through and a gap left of the fill edge reads lighter than one right of it. The\n   \"border\" is the OUTSET box-shadow on this same pseudo: zero box-model impact, so trackH and\n   every tick anchor stay put, and it survives the pulse rewriting the track's box-shadow.\n   z-index:1 = above the auto-z fill, below the z-index:2 ticks. */\n.mp-track::after {\n  content: \"\";\n  position: absolute; left: 0; top: 0; width: 100%; height: 100%;\n  z-index: 1;\n  background-image: repeating-linear-gradient(90deg,rgba(236,230,218,0.16) 0rem,rgba(236,230,218,0.16) 2rem,rgba(13,14,16,1) 2rem,rgba(13,14,16,1) 3rem);\n  background-size: 3rem 100%;\n  background-repeat: repeat;\n  box-shadow: 0 0 0 1rem rgba(13,14,16,0.5);\n}\n.mp-fill {\n  position: absolute;\n  left: 0;\n  top: 0;\n  height: 100%;\n  width: 0;\n  background: rgba(237,230,217,0.8);\n  transition: width 400ms cubic-bezier(.2,.8,.2,1);\n}\n/* CENTRED tick geometry (the shipped .mp-tick): the tick CROSSES the track, top:50% +\n   translate(-50%,-50%), so its height is symmetric about the track midline. */\n.mp-tick { position: absolute; top: 50%; width: 2rem; z-index: 2; }\n.mp-tick.mp-req { height: 9rem; background: rgba(237,230,217,0.8);\n                  transform: translate(-50%, -50%) translateY(0rem); }\n.mp-tick.mp-req.met { background: rgba(237,230,217,0.8); }\n.mp-tick.mp-cur {\n  width: 2rem;\n  height: 9rem;\n  background: rgba(255,255,255,1);\n  transform: translate(-50%, -50%) translateY(0rem);\n  transition: left 400ms cubic-bezier(.2,.8,.2,1);\n}\n/* The four requirement ticks + caps are FIXED at the quarter marks -- that IS the axis, and\n   it is why nothing but the current tick/cap/fill needs a JS position. QUALIFIED with the\n   element class on purpose: a bare .rN is ONE class, same as .mp-cap's own `left: 0` below,\n   which would then win on source order and stack all four caps at 0%. */\n.mp-tick.r1, .mp-cap.r1 { left: 25%; }\n.mp-tick.r2, .mp-cap.r2 { left: 50%; }\n.mp-tick.r3, .mp-cap.r3 { left: 75%; }\n.mp-tick.r4, .mp-cap.r4 { left: 100%; }\n/* THE NUMERAL IS WHAT SITS ON THE TICK: .mp-cap's only IN-FLOW child is .mp-v, so\n   translateX(-50%) centres the digits themselves. The icon and the delta hang OFF the numeral\n   out of flow (see .mp-ico / .mp-cap .mp-d below), which is also what stops the delta fading in\n   from shifting the number. NOT a flex row: a row centres icon+number as one box and puts the\n   number right of its tick by half the icon+gap. */\n.mp-cap {\n  position: absolute;\n  left: 0;\n  transform: translateX(-50%);\n  white-space: nowrap;\n  z-index: 3;\n}\n/* A TRANSFORM, NOT MARGIN, ON THE `bottom:100%` SIDE: Coherent ignores margin-bottom on an\n   abspos box anchored that way (0/515 precedents in WG's _dist corpus). padding-bottom is the\n   other form Coherent honours, but it would grow this cap's PADDING BOX -- which is what the\n   out-of-flow .mp-ico's top:50% resolves against, dragging the glyph half the gap below the\n   numeral. The `top:100%` twin's margin-top DOES work -- do not unify them. Both gaps are\n   TICK-INCLUSIVE (tick height + the tuned gap) so no calc() mixes units. */\n/* The signed X below is a RESIDUAL nudge (0 by default): the numeral is already on its tick by\n   construction. Composed onto the same transform as the -50% centring. */\n/* EVERY CAPTION PINS ITS LINE BOX, and that is a BUG FIX, not a style choice. With\n   `line-height: normal` the line box is the font's ascent+descent+gap SNAPPED UP TO WHOLE DEVICE\n   PIXELS, so in rem it is NOT constant -- it shrinks as the rem->px factor grows. Measured live:\n   a 16rem caption is 21.000rem at factor 1, 20.500 at 2, 20.125 at 24; a 12rem one 16.000 /\n   15.500 / 15.083. The out-of-flow .mp-ico is `top: 50%` of exactly that box, so HALF the\n   variation lands in the glyph's Y and the icon (and the delta, whose own box shrinks the same\n   way) drift below the numeral at low interface scales -- reported at 3440x1440, factor 1.\n   THE VALUE: ceil(font_rem * 2 * 1.2565) / 2, i.e. the FACTOR-2 box expressed in rem. 1.2565 is\n   MoEBattle.ttf's fitted line ratio and ceil(font_px * 1.2565) reproduces all six measurements.\n   Pinned at the FACTOR-2 value on purpose, not at the font's true unsnapped ratio: factor 2 is the\n   render this composition was approved on and must not move by even one device pixel, while a\n   `1.2565em` line-height would compute to 40.2px there and shift it 0.75px. So every pin here is\n   byte-identical to what `normal` already yielded at factor 2; only factors != 2 change.\n   NO LARGE-MODE TWIN, EVER: line-height is a uniform (vertical) length, so the root font (SIZE_F)\n   scales it alone and a twin would double-apply it. NOT FIXED by this, and left as a\n   known residual: the glyph's own ascent snap INSIDE the pinned box (sub-0.5rem, and it moves the\n   numeral and its delta together rather than pulling them apart).\n   ...AND THE PIN IS NOW LOAD-BEARING FOR A SECOND FIX, which is why it must not be reverted or\n   turned back into an em: it makes each caption's box a CONSTANT number of rem, so the vertical\n   anchor of the out-of-flow pieces hanging off it -- line/2 - own box/2 + the tuned nudge -- is a\n   constant too, and CAN be quantised. It is not, however, a whole number of DEVICE pixels: at the\n   shipped values it lands on a quarter of a rem (the current row's glyph: 20.5/2 - 16/2 + 0.5 ==\n   2.75rem), which is whole only where the rem->px factor is a multiple of 4. At factor 2 it is a\n   whole HALF pixel -- the approved render. At factor 1 (interface scale 1, reported at 3440x1440)\n   it is 0.75 of a device pixel, so the engine resolves the glyph's box origin DOWN-SCREEN -- one\n   device pixel low on the current-damage caption's icon, and on nothing else.\n   THE RESIDUAL IS CORRECTED IN HAND-ADDED BLOCK 4 (the `.mp-s1` pair at the end of this file),\n   gated on the interface scale by MoEBarTransient.setQuantClass so factor 2 -- the approved render\n   -- cannot match any of it. The correction is a MEASURED -1rem, not this arithmetic: the anchor\n   above says why a residual exists, it does not predict the number. See that block and\n   tests/test_caption_anchor_quantisation.py. */\n.mp-cap.dn { top: 100%; margin-top: 12rem; font-size: 12rem;\n             line-height: 15.5rem;\n             transform: translateX(-50%) translateX(0rem); }\n.mp-cap.up { bottom: 100%; font-size: 16rem;\n             line-height: 20.5rem;\n             transform: translateX(-50%) translateX(0rem) translateY(-12rem);\n             transition: left 400ms cubic-bezier(.2,.8,.2,1); }\n.mp-cap .mp-v {\n  position: relative;\n  color: #ffffff;\n  font-weight: 600;\n  letter-spacing: 0em;\n  text-shadow: 0 0 1rem rgba(0,0,0,0.5);\n}\n.mp-cap.dn .mp-v { transform: translateY(0rem); }\n.mp-cap.up .mp-v { transform: translateY(0rem); }\n/* The delta hangs OUT OF FLOW off the numeral's right edge (left:100% + a transform gap, the\n   same idiom as .mp-ico's mirror on the right:100% side), so .on toggling cannot move the\n   number -- and top:0 is an ANCHOR, not a position: the X gap and the signed Y both ride that\n   ONE translate(), in ONE unit (the gap is tuned in em of the delta's own size and resolved to\n   rem, since no Gameface-confirmed stylesheet mixes units in a multi-argument translate).\n   It FADES on opacity, which interpolates; visibility cannot. JS adds .on at the hit\n   and drops it after the hold. It is WHITE with NO band glow -- that glow is the current total's\n   signal alone, so .mp-d-num appears in no band rule and needs no rule of its own; it inherits\n   everything here and JS writes the signed digits into it. The dark text-shadow is legibility\n   over a bright HUD, not a glow -- keep it. No parens on this bar: .mp-d carries the gap, size\n   and fade, .mp-d-num alone carries the digits. */\n.mp-cap .mp-d {\n  position: absolute;\n  left: 100%;\n  top: 0;\n  transform: translate(4.2rem, 2.5rem);\n  font-size: 12rem;\n  line-height: 15.5rem;\n  color: #ffffff;\n  font-weight: 600;\n  text-shadow: 0 0 1rem rgba(0,0,0,0.5);\n  opacity: 0;\n  transition: opacity 500ms ease-out;\n}\n.mp-cap .mp-d.on { opacity: 1; }\n\n/* ---- BANDS. Exactly ONE of these classes on #moe-bar-root at a time, chosen by which\n   requirement the current damage has passed (>= INCLUSIVE, so damage on r65 is already green).\n   The fill and the current tick's GLOW share the band's fill colour (the tick's own line is the\n   static colour above, so the marker reads the same at every band); the current TOTAL's numerals\n   and the glyph glow further down take that band's two OWN glow colours, tuned per band. The\n   delta (.mp-d-num) is in NONE of these -- it stays white with only the dark drop. */\n#moe-bar-root.mp-b-w .mp-fill { background: rgba(237,230,217,0.8); }\n#moe-bar-root.mp-b-w .mp-tick.mp-cur { box-shadow: 0 0 6rem rgba(237,230,217,0.8),0 0 2rem rgba(237,230,217,0.8); }\n#moe-bar-root.mp-b-w .mp-cap.up .mp-v { text-shadow: 0 0 1rem rgba(0,0,0,0.5),0 0 6rem rgba(237,230,217,0.5),0 0 2rem rgba(237,230,217,0.5); }\n#moe-bar-root.mp-b-g .mp-fill { background: rgba(123,236,55,0.8); }\n#moe-bar-root.mp-b-g .mp-tick.mp-cur { box-shadow: 0 0 6rem rgba(123,236,55,0.8),0 0 2rem rgba(123,236,55,0.8); }\n#moe-bar-root.mp-b-g .mp-cap.up .mp-v { text-shadow: 0 0 1rem rgba(0,0,0,0.5),0 0 6rem rgba(123,236,55,0.9),0 0 2rem rgba(123,236,55,0.9); }\n#moe-bar-root.mp-b-t .mp-fill { background: rgba(51,146,230,0.8); }\n#moe-bar-root.mp-b-t .mp-tick.mp-cur { box-shadow: 0 0 6rem rgba(51,146,230,0.8),0 0 2rem rgba(51,146,230,0.8); }\n#moe-bar-root.mp-b-t .mp-cap.up .mp-v { text-shadow: 0 0 1rem rgba(0,0,0,0.5),0 0 6rem rgba(90,154,211,1),0 0 2rem rgba(90,154,211,1); }\n#moe-bar-root.mp-b-v .mp-fill { background: rgba(115,23,196,0.8); }\n#moe-bar-root.mp-b-v .mp-tick.mp-cur { box-shadow: 0 0 6rem rgba(115,23,196,0.8),0 0 2rem rgba(115,23,196,0.8); }\n#moe-bar-root.mp-b-v .mp-cap.up .mp-v { text-shadow: 0 0 1rem rgba(0,0,0,0.5),0 0 6rem rgba(115,23,196,1),0 0 2rem rgba(115,23,196,1); }\n#moe-bar-root.mp-b-au .mp-fill { background: rgba(255,205,90,0.8); }\n#moe-bar-root.mp-b-au .mp-tick.mp-cur { box-shadow: 0 0 6rem rgba(255,205,90,0.8),0 0 2rem rgba(255,205,90,0.8); }\n#moe-bar-root.mp-b-au .mp-cap.up .mp-v { text-shadow: 0 0 1rem rgba(0,0,0,0.5),0 0 6rem rgba(255,205,90,0.9),0 0 2rem rgba(255,205,90,0.9); }\n\n/* Icons: GLYPH on ::after, GLOW on ::before at z-index:-1 (an element's own background paints\n   BELOW its pseudos). .mp-ico's transform is the stacking context that scopes that -1 AND it\n   carries the per-role Y nudge AND the gap to the numeral -- never trade it for a margin, which\n   Coherent drops on the `right:100%` anchored side anyway. background-size is DERIVED:\n   100/bbox*0.75 from the ink measured at ALPHA > 32 (the quest_type art's faint halo\n   makes a raw getbbox() read ~2x too big: barrel_mark 0.328, damage 0.219).\n   brightness(3) lifts the flat grey #d1d1d1 quest_type line art; the marksOnGun cuts\n   are 24x24 and already warm cream, so theirs is its OWN knob, at 1 here (1 == identity,\n   no lift). Their canvas is constant and only the WIDTH grows with the count, so mark_1 renders\n   ~1/3 the width of mark_3 on one fixed box -- correct, do not trim per count. They visibly\n   blur above ~24rem.\n   The icon is OUT OF FLOW off the numeral's left edge, and its gap rides in that SAME\n   transform: `right:100%` + margin-right renders a 0 gap in Coherent, and\n   `right: calc(100% + Xrem)` mixes % with rem (0/515 precedents in WG's corpus). */\n.mp-ico {\n  position: absolute;\n  right: 100%;\n  top: 50%;\n  display: block;\n  width: 13rem;\n  height: 13rem;\n  transform: translate(-1rem, -50%);\n}\n.mp-cap.dn .mp-ico { transform: translate(-1rem, -50%) translateY(0.25rem); }\n.mp-cap.up .mp-ico { transform: translate(-1rem, -50%) translateY(0.5rem); }\n/* The 100% cap's glyph is a DIFFERENT family from the three marks beside it, so it takes its\n   own Y. (0,4,0) beats the rule above, and it stays on the same transform -- that transform is\n   the stacking context that scopes the ::before glow's z-index:-1. */\n.mp-cap.dn .mp-ico.bm { transform: translate(-1.253rem, -50%) translateY(-0.25rem); }\n/* PER-ICON INK-GAP PARITY (maintainer's ask, box sizes untouched): the box-edge gap above is a\n   uniform --icoGap, but each art asset's own zoom/canvas leaves a different INK gap, so these\n   two literal X overrides equalise it instead, calibrated off the real PNGs' alpha>32 bbox to a\n   flat 3.000rem target (this bar's own dmg/current icon -- untouched -- naturally lands\n   ~3.006rem; every other row is calibrated to the flat 3.000rem target against it, same\n   convention both MA passes used, and this bm literal is IDENTICAL to MoEProgress.css's dmgp --\n   same box (14rem), same asset (barrel_mark, 228.7%)). mk is calibrated to mark_2 ALONE\n   (contain-scaled on a 24x24 canvas, box 16rem); mark_1/mark_3 land off it by +-2rem -- an\n   accepted residual, same class as MoEProgress.css's own mark correction. Literal, not\n   slider-driven: a box-size retune here would need these re-measured by hand, same as the\n   horizontal Moving Average bar's own pass. */\n.mp-cap.dn .mp-ico.mk { transform: translate(1rem, -50%) translateY(0.25rem); }\n.mp-cap.dn .mp-ico.mk1 { transform: translate(2.000rem, -50%) translateY(1rem); }\n.mp-cap.dn .mp-ico.mk2 { transform: translate(0.000rem, -50%) translateY(1rem); }\n.mp-cap.dn .mp-ico.mk3 { transform: translate(-1.500rem, -50%) translateY(1rem); }\n.mp-ico::before {\n  content: \"\";\n  position: absolute;\n  left: 50%;\n  top: 50%;\n  z-index: -1;\n  width: 106%;\n  height: 106%;\n  transform: translate(-50%, -50%);\n  background: radial-gradient(circle at 50% 50%, rgba(255,205,90,0.5) 0%, transparent 73%);\n}\n/* The requirement glyphs and the current one glow independently of that fallback. BACKGROUND\n   ONLY: the base rule keeps the z-index:-1, the 106% box and its own centring, and these target\n   ::before, never .mp-ico. The current cap follows its BAND, at the numeral-glow alpha. */\n.mp-cap.dn .mp-ico::before {\n  background: radial-gradient(circle at 50% 50%, rgba(26,26,26,0.5) 0%, transparent 73%);\n}\n#moe-bar-root.mp-b-w .mp-cap.up .mp-ico::before { background: radial-gradient(circle at 50% 50%, rgba(237,230,217,0.3) 0%, transparent 73%); }\n#moe-bar-root.mp-b-g .mp-cap.up .mp-ico::before { background: radial-gradient(circle at 50% 50%, rgba(123,236,55,0.8) 0%, transparent 73%); }\n#moe-bar-root.mp-b-t .mp-cap.up .mp-ico::before { background: radial-gradient(circle at 50% 50%, rgba(90,154,211,0.8) 0%, transparent 73%); }\n#moe-bar-root.mp-b-v .mp-cap.up .mp-ico::before { background: radial-gradient(circle at 50% 50%, rgba(115,23,196,0.8) 0%, transparent 73%); }\n#moe-bar-root.mp-b-au .mp-cap.up .mp-ico::before { background: radial-gradient(circle at 50% 50%, rgba(255,205,90,0.9) 0%, transparent 73%); }\n.mp-ico::after {\n  content: \"\";\n  position: absolute; left: 0; top: 0; width: 100%; height: 100%;\n  background-repeat: no-repeat;\n  background-position: center;\n}\n.mp-ico.mk { width: 16rem; height: 16rem; }\n.mp-ico.mk::after { background-size: contain; filter: brightness(1); }\n.mp-ico.mk1::after { background-image: url(img://gui/maps/icons/library/marksOnGun/mark_1.png); }\n.mp-ico.mk2::after { background-image: url(img://gui/maps/icons/library/marksOnGun/mark_2.png); }\n.mp-ico.mk3::after { background-image: url(img://gui/maps/icons/library/marksOnGun/mark_3.png); }\n.mp-ico.bm { width: 14rem; height: 14rem; }\n.mp-ico.bm::after {\n  background-image: url(img://gui/maps/icons/personal_missions_30/quest_type/128x128/icon_battle_condition_barrel_mark.png);\n  background-size: 228.7%;\n  filter: brightness(3);\n}\n.mp-ico.dmg { width: 16rem; height: 16rem; }\n.mp-ico.dmg::after {\n  background-image: url(img://gui/maps/icons/personal_missions_30/quest_type/128x128/icon_battle_condition_damage.png);\n  background-size: 342.5%;\n  filter: brightness(3);\n}\n\n/* The transient + the 100% pulse. GAMEFACE: a transform transition needs MATCHING FUNCTION\n   LISTS across every keyframe, so translateY() appears on ALL FOUR stops. Separate in/out\n   easings inside one animation means per-stop animation-timing-function; the middle stop is\n   linear so the hold cannot creep. The exit RETURNS the way it came. */\n@keyframes mp-life{\n  0%{opacity:0;transform:translateY(20rem);animation-timing-function:ease-in}\n  9.68%{opacity:1;transform:translateY(0rem);animation-timing-function:linear}\n  90.32%{opacity:1;transform:translateY(0rem);animation-timing-function:ease-in}\n  100%{opacity:0;transform:translateY(20rem)}}\n#moe-bar-root.mp-run{animation:mp-life 6200ms both}\n@keyframes mp-pulse{\n  0%,100%{box-shadow:0 0 8rem rgba(255,205,90,0.9)}\n  50%{box-shadow:0 0 16rem rgba(255,205,90,1.00)}}\n#moe-bar-root.mp-b-au.mp-pulse .mp-track{animation:mp-pulse 1200ms ease-in-out infinite}\n\n/* Axis + timings for the Python/JS side (the numbers, not just the CSS):\n{\n  \"axis\": \"damage, five stops -> four equal quarters (barX in MoECalculator.js:302-322)\",\n  \"dmgStopsSource\": \"snapshot.thresholds{1,2,3,100}\",\n  \"barStops\": [\n    0,\n    25,\n    50,\n    75,\n    100\n  ],\n  \"fadeInMs\": 600,\n  \"holdMs\": 5000,\n  \"fadeOutMs\": 600,\n  \"totalMs\": 6200,\n  \"slideRem\": 20,\n  \"slideEasingIn\": \"ease-in\",\n  \"slideEasingOut\": \"ease-in\",\n  \"fillDurationMs\": 400,\n  \"fillEasing\": \"cubic-bezier(.2,.8,.2,1)\",\n  \"deltaHoldMs\": 1600,\n  \"deltaFadeMs\": 500,\n  \"deltaFadeEasing\": \"ease-out\",\n  \"pulseMs\": 1200,\n  \"bands\": [\n    {\n      \"name\": \"white\",\n      \"cls\": \"mp-b-w\",\n      \"colour\": \"rgba(237,230,217,0.8)\"\n    },\n    {\n      \"name\": \"green\",\n      \"cls\": \"mp-b-g\",\n      \"colour\": \"rgba(123,236,55,0.8)\"\n    },\n    {\n      \"name\": \"teal\",\n      \"cls\": \"mp-b-t\",\n      \"colour\": \"rgba(51,146,230,0.8)\"\n    },\n    {\n      \"name\": \"violet\",\n      \"cls\": \"mp-b-v\",\n      \"colour\": \"rgba(115,23,196,0.8)\"\n    },\n    {\n      \"name\": \"gold\",\n      \"cls\": \"mp-b-au\",\n      \"colour\": \"rgba(255,205,90,0.8)\"\n    }\n  ],\n  \"capClamp\": {\n    \"enabled\": true,\n    \"leftRem\": -76,\n    \"rightRem\": 376\n  },\n  \"boxWRem\": 460,\n  \"glyphBbox\": {\n    \"barrel_mark\": 0.328,\n    \"damage\": 0.219,\n    \"note\": \"ink measured at alpha>32 on the 128px canvas (a raw getbbox reads ~2x too big)\"\n  }\n}\n*/\n\n/* ===== HAND-ADDED BLOCK 2 OF 4 -- a byte-identical copy of @keyframes mp-life / #moe-bar-root.mp-run\n   above, renamed. NOT tuned, and no tuned value touched.\n   WHY: JS restarts the transient (a hit landing while the bar is already up re-measures the\n   fade-out from that event) with the classic remove-class -> force-reflow -> re-add-class idiom,\n   which is UNPROVEN in Coherent/Gameface. If the engine coalesces the re-add with the run it just\n   cancelled, the restart is a NO-OP -- and because #moe-bar-root rests at opacity 0 under `both`\n   fill, that leaves the bar permanently INVISIBLE after its first appearance. That is not a\n   hypothesis: it is the exact reported symptom the Moving Average bar shipped with, and\n   MoEProgress.css:512-529 carries this same pair for the same reason. So MoEEfficiency.js\n   ALTERNATES between .mp-run and .mp-run-b (armRun): consecutive runs carry DIFFERENT\n   animation-names, which the engine cannot coalesce.\n   Keep the two blocks identical: any tuner change to mp-life must be mirrored here verbatim.\n   Once a launch proves the plain restart works in Coherent, delete this pair and drop armRun's\n   alternation. ===== */\n@keyframes mp-life-b{\n  0%{opacity:0;transform:translateY(20rem);animation-timing-function:ease-in}\n  9.68%{opacity:1;transform:translateY(0rem);animation-timing-function:linear}\n  90.32%{opacity:1;transform:translateY(0rem);animation-timing-function:ease-in}\n  100%{opacity:0;transform:translateY(20rem)}}\n#moe-bar-root.mp-run-b{animation:mp-life-b 6200ms both}\n/* ===== END HAND-ADDED BLOCK 2 ===== */\n\n/* ===== HAND-ADDED BLOCK 3 OF 4 -- THE \"LARGE\" SIZE MODE (mod_settings.progress_bar_size == 1).\n   NOT tuned, and no tuned value above is touched. The tuner has no size mode at all, which is why\n   this cannot come out of the emit.\n   WHY SO LITTLE CSS: the mode is delivered by the ROOT FONT SIZE (MoEBarTransient.js's SIZE_F ==\n   1.25, which IS the rem->px factor in Gameface -- WG's own bootstrap writes it from\n   self.onScaleUpdated, and our registered views never load that bootstrap, hence every\n   \"1rem == 1 logical px\" comment in this mod). That single write re-lays the whole composition\n   1.25x larger, CRISPLY, and correctly leaves every %, em, `contain`, gradient stop and derived\n   icon background-size ratio alone -- so height, every font, every icon box, every glow radius, the\n   vertical gaps and mp-life's 20rem slide all scale with NO rule below. What is left is the\n   HORIZONTAL x-lengths: an x-length must carry an extra SIZE_XF == 4/3 (1.25 * 4/3 == 5/3), so\n   EVERY declaration below is an x-length and nothing else. Do NOT add a font-size, a height or a\n   keyframe here -- that would double-apply SIZE_F.\n   SCOPE: `.mp-lg` goes on the BODY (MoEBarTransient.applySize), WG's own ancestor-class idiom\n   (.mediaLargeWidth ...). It cannot go on #moe-bar-root: #moe-bar-box is a body-level SIBLING of the\n   JS-created root. Every selector is its base rule plus one class, so it out-specifies it (the .bm\n   glyph needs its own line: without it the .mp-cap.dn .mp-ico rule below, being LATER in the file at\n   equal specificity, would swallow that glyph's own Y).\n   The .bm and .mk lines below are the Large twins of the emit's own per-icon ink-gap-parity\n   overrides (see the emit's own comment above .mp-cap.dn .mp-ico.bm/.mk): literal, SIZE_XF (4/3)\n   applied by hand to the Default literal, never re-derived from the shared --icoGap knob.\n===== */\n.mp-lg #moe-bar-box { width: 613.333rem; }\n.mp-lg #moe-bar-root { width: 400rem; }\n.mp-lg .mp-backdrop { left: -106.667rem; width: 613.333rem; }\n.mp-lg .mp-track::after {\n  background-image: repeating-linear-gradient(90deg,rgba(236,230,218,0.16) 0rem,rgba(236,230,218,0.16) 2.667rem,rgba(13,14,16,1) 2.667rem,rgba(13,14,16,1) 4rem);\n  background-size: 4rem 100%;\n}\n.mp-lg .mp-tick { width: 2.667rem; }\n.mp-lg .mp-tick.mp-cur { width: 2.667rem; }\n.mp-lg .mp-cap .mp-d { transform: translate(5.6rem, 2.5rem); }\n.mp-lg .mp-ico { transform: translate(-1.333rem, -50%); }\n.mp-lg .mp-cap.dn .mp-ico { transform: translate(-1.333rem, -50%) translateY(0.25rem); }\n.mp-lg .mp-cap.up .mp-ico { transform: translate(-1.333rem, -50%) translateY(0.5rem); }\n.mp-lg .mp-cap.dn .mp-ico.bm { transform: translate(-1.671rem, -50%) translateY(-0.25rem); }\n.mp-lg .mp-cap.dn .mp-ico.mk { transform: translate(1.333rem, -50%) translateY(0.25rem); }\n.mp-lg .mp-cap.dn .mp-ico.mk1 { transform: translate(1.000rem, -50%) translateY(1rem); }\n.mp-lg .mp-cap.dn .mp-ico.mk2 { transform: translate(0.000rem, -50%) translateY(1rem); }\n.mp-lg .mp-cap.dn .mp-ico.mk3 { transform: translate(-2.000rem, -50%) translateY(1rem); }\n/* ===== END HAND-ADDED BLOCK 3 ===== */\n\n/* ===== HAND-ADDED BLOCK 4 OF 4 -- THE INTERFACE-SCALE CAPTION CORRECTIONS. The tuner has no notion\n   of the interface scale, which is why this cannot come out of the emit.\n   THE BUG: on the current-damage caption (.mp-cap.up), the damage ICON and the DELTA each sit ONE\n   device pixel low at interface scale 1 and are both correct at scale 2. Measured on verified\n   relaunches, same replay and tank at both scales, ink gated achromatically.\n   MEASURE AGAINST THE DIGIT BASELINE, NEVER THE DIGIT TOP. The ink top is GLYPH-DEPENDENT -- it moves\n   with WHICH digits are on screen -- and that is exactly the trap that hid the delta for a whole\n   session: read against the top, the delta looked scale-invariant and only the icon looked wrong.\n   Compare WITHIN the row, baseline-relative, on shots whose UP row is the same shape (both plain\n   3-digit, no comma):\n                                        scale 1 (shot_050)   scale 2 (shot_049, confirmed by _045)\n       digits                           1839..1850           1811..1833\n       delta                            1841..1849           1813..1829\n       delta bottom - digit baseline    -1.00rem             -2.00rem     <- the delta is 1rem LOW\n       icon bottom  - digit baseline    -1.00rem             -0.50rem     <- residual 0.5rem, SUB-PIXEL\n                                                                             at scale 1: on the grid,\n                                                                             NOT to be touched\n   (Anchor for the table: the track top is 1866 at scale 1 and 1860 at scale 2 in every shot, and the\n   caption row sits at a different REM offset from the track at the two scales because of line-box\n   rounding -- which is why only within-row, baseline-relative comparisons mean anything here. The\n   icon's own correction was verified live: ink top 1841 -> 1840 at scale 1, scale 2 untouched.)\n   EVERY -1rem HERE IS MEASURED AGAINST THE RENDER, NOT DERIVED FROM BOX ARITHMETIC. The anchor\n   arithmetic (line/2 - own box/2 + nudge == 2.75rem, a quarter of a rem, whole only where the rem->px\n   factor is a multiple of 4) explains WHY a residual exists at factor 1 and not at factor 2; it does\n   not predict any of these numbers.\n   EVERY VALUE IS ITS OWN BASE RULE'S Y MINUS EXACTLY 1rem (the icon 0.5 -> -0.5, the delta 2.5 ->\n   1.5), with the x term taken VERBATIM from that same base -- so a future retune moves the\n   correction with it.\n   ...PLUS, ON THE TWO LARGE RULES ONLY, A PER-PIXEL NUDGE EYEBALLED AGAINST THE LARGE RENDER AT\n   INTERFACE SCALE 1. Distinct in kind from the -1rem above, which came off ink extents: these two\n   are the maintainer's eye on the composition, so they are a CALIBRATION, not a derivation.\n       icon   1 device px DOWN   -0.5 + 0.8 == 0.3rem\n       delta  1 device px UP      1.5 - 0.8 == 0.7rem\n   1 device px is 1/SIZE_F rem here, because Large IS the root font: baseFont * SIZE_F == 1 * 1.25,\n   so 0.8rem exactly. The two nudges are INDEPENDENT -- they landed on the same 0.167rem at the\n   earlier SIZE_F == 1.5 (a coincidence of two opposite nudges one rem apart) and no longer agree at\n   SIZE_F == 1.25, and the delta's own pixel count moved again for a later 1px-down retune (2 device\n   px UP -> 1 device px UP) while the icon's did not -- they must NEVER be factored into a shared\n   constant. A future retune of a base Y has to carry BOTH terms (see the pin in\n   tests/test_caption_anchor_quantisation.py, which re-derives each value as base - 1rem +/- an\n   explicit device-PIXEL COUNT over SIZE_F).\n   THE DEFAULT-SIZE PAIR TAKES NO NUDGE: both plain rules are verified live at scale 1 and stay at\n   -0.5rem / 1.5rem.\n   TWO RULES PER ELEMENT, AND THE SECOND IS A COMPOUND. Both classes land on document.body, so a lone\n   .mp-s1 rule -- later in the file and at equal or higher specificity -- would also beat the\n   `.mp-lg` twin and replace its x-length (the icon's -1.333rem with -1rem, the delta's 5.6rem with\n   4.2rem), shoving the element sideways at scale 1 + Large. `.mp-s1.mp-lg` (both classes on the SAME\n   element, no descendant combinator) out-specifies the twin outright, so only Y moves.\n   ALWAYS THE FULL COMPOUND TRANSFORM: a bare translateY() replaces the whole declaration and silently\n   drops the icon's -50% centring (and the stacking context that scopes the ::before glow's\n   z-index:-1) or the delta's whole x gap.\n   INTERFACE SCALE 2 IS STRUCTURALLY UNMATCHABLE, which is the maintainer's hard constraint made\n   mechanical rather than promised: setQuantClass reads the base font at/above 1.5 there and adds no\n   class at all, so no selector here can match and the base cascade is bit-for-bit the approved\n   render. Same for an untrusted read (see the trust gate in MoEBarTransient.js).\n===== */\n.mp-s1 .mp-cap.up .mp-ico       { transform: translate(-1rem, -50%) translateY(-0.5rem); }\n.mp-s1.mp-lg .mp-cap.up .mp-ico { transform: translate(-1.333rem, -50%) translateY(0.3rem); }\n.mp-s1 .mp-cap .mp-d            { transform: translate(4.2rem, 1.5rem); }\n.mp-s1.mp-lg .mp-cap .mp-d      { transform: translate(5.6rem, 0.7rem); }\n/* ===== END HAND-ADDED BLOCK 4 ===== */\n";
var CSS_MEV = "/* MoEEfficiencyVertical.css -- VERTICAL variant of the in-battle DAMAGE EFFICIENCY bar (class\n   prefix .mev-, never .mp-). Tuned in the browser (tools/dev/eff_bar_tuner_vertical.html) and\n   ported from that tuner's cssOut(): it has NO -EmitCss switch and its \"Copy CSS\" button is\n   clipboard-only, so the emit is regenerated HEADLESSLY the way tools/dev/check_eff_vertical.js\n   already does it -- read the tuner as text, truncate at its \"// ---- panel wiring\" marker, and\n   evaluate cssOut() with `new Function` against a self-returning stub node. Do NOT point\n   tools/dev/emit_eff_css.js at the vertical tuner: it targets the HORIZONTAL one by literal\n   filename. The battle window has no hot-reload; tune in the browser, not in the client.\n\n   AXIS: damage, BOTTOM (0%) to TOP (100%), the same piecewise-linear five-stop -> four-equal-\n   quarters mapping as the horizontal sibling, rotated. The fill grows via `height` from bottom:0;\n   every marker positions with bottom:<pct> + translateY(+50%) -- note the +50%, not the horizontal\n   bar's -50%: a bottom-anchored box must shift back DOWN by half its own length to land on its\n   point. Position comes from Python (window.move()), NOT from CSS.\n\n   THIS SHEET IS LOADED ALONGSIDE MoEEfficiency.css, NOT INSTEAD OF IT (MoEEfficiencyView.html\n   links both; orientation is a MOUNT-TIME branch in MoEEfficiency.js, not a second res_map layout\n   -- a new itemID would cost every user a one-time client restart). The two sheets are\n   namespace-DISJOINT by construction (.mp-* vs .mev-*), so nothing below can collide with a\n   horizontal rule except the THREE shared subjects -- `body`, `#moe-bar-box` and `#moe-bar-root` --\n   and those are the only selectors here carrying the `body.mev` scope. `mev` goes on the BODY\n   (MoEBarTransient's goVertical), because #moe-bar-box is a body-level SIBLING of the JS-created\n   root and a class on the root could never reach it; `body.mev ...` is also (1,1,1) so it\n   out-specifies the horizontal sheet's own `.mp-lg #moe-bar-root` (1,1,0) outright rather than\n   winning on source order.\n\n   THE SHIPPED FILE IS THE EMIT PLUS FIVE DELIBERATE HAND-EDITS -- never copy an emit over it (the\n   repo lesson `emitcss-is-not-the-whole-shipped-stylesheet`). Each is marked HAND-EDIT n/5:\n     1  `#mev-bar-root` is normalised to the shipped `#moe-bar-root` THROUGHOUT (the tuner uses its\n        own id purely so a candidate can never collide with the shipped bar).\n     2  the root rule drops the tuner's `right: 639px; bottom: 28px` minimap-placement PREVIEW --\n        that is a JS mock of a Python computation and must never reach the stylesheet -- and gains\n        the shipped root's `left: 0; top: 0` origin, z-index and pointer-events:none.\n     3  #moe-bar-box, the sizing shim -- not emitted at all (the tuner has no surface).\n     4  `.mev-lg` becomes `.mp-lg` -- the body class MoEBarTransient.applySize actually writes.\n     5  the two Large rules whose subject is #moe-bar-root / #moe-bar-box are scoped `body.mev.mp-lg`.\n   NOT a hand-edit here, unlike the sibling MoEProgressVertical.css: this tuner ALREADY emits the\n   dash grid's gap stripe opaque (rgba(13,14,16,1)), pinned by check_eff_vertical.js. Leave it.\n   The @font-face is not re-declared either -- MoEEfficiency.css is <link>ed in the same document\n   and carries it. Anything else diverging from a fresh emit is drift, not intent. */\n\n/* HAND-EDIT 1/5 + 2/5 -- see the header. */\nbody.mev #moe-bar-root {\n  position: absolute;\n  left: 0;\n  top: 0;\n  width: 3rem;\n  height: 200rem;\n  z-index: 9000;\n  pointer-events: none;\n  font-family: \"MoEBattle\", \"Arial Narrow\", sans-serif;\n  opacity: 0;\n}\n/* HAND-EDIT 3/5 -- THE SIZING SHIM. #moe-bar-root is position:absolute and contributes ZERO\n   content size, so #moe-bar-box (declared in MoEEfficiencyView.html, NOT JS-created -- it must\n   exist at the FIRST layout pass) is what gives the document in-flow content. IT DOES NOT STOP THE\n   ENGINE'S SIZE TIMEOUT -- re-measured live on the Moving Average bar and disproven;\n   MoEBarTransient's post-deadline SURFACE_REASSERT_MS is the only fix. Kept because it is the\n   honest description of the document's size, and the horizontal sheet's 460x55 is the wrong shape\n   entirely for this composition. Unlike the horizontal file's box (which is left at the tuner's own\n   emitted 460x55 and is deliberately NOT a copy of the surface), this one IS the surface\n   MoEEfficiency.js pushes: width V_BOX_W_REM + 2*PAD_REM == 96+20, height\n   V_BOX_H_REM + 2*PAD_REM - V_CLIP_B_REM == 360+20-62.\n   THE HEIGHT IS 62rem SHORT OF THE COMPOSITION ON PURPOSE, and that is the surface's own doing, not\n   this rule's: the surface CLIPS .mev-backdrop's lower bleed so the engine's screen clamp can bring\n   the bar's track down to the tuner's 28-logical-px `bottomGap` off the screen bottom (read\n   MoEEfficiency.js's V_CLIP_B_REM note, and its sibling MoEProgress.js's, for the derivation). This\n   rule only keeps describing whatever the surface actually is, and it stays a plain rem box either\n   way, so it cannot reflow the composition when the surface shrinks past it. */\nbody.mev #moe-bar-box { width: 116rem; height: 318rem; }\n.mev-backdrop {\n  position: absolute;\n  top: -80rem;\n  left: -40rem;\n  height: 360rem;\n  width: 96rem;\n  z-index: 0;\n}\n.mev-backdrop::before {\n  content: \"\";\n  position: absolute; left: 0; top: 0; width: 100%; height: 100%;\n  background: url(checker.png) repeat;\n  background-size: auto;\n  image-rendering: pixelated;\n  opacity: 0.1;\n  mask: radial-gradient(56% 110% at 50% 50%,#000 0%,transparent 67%);\n}\n.mev-backdrop::after {\n  content: \"\";\n  position: absolute; left: 0; top: 0; width: 100%; height: 100%;\n  z-index: -1;\n  background: radial-gradient(76% 57% at 50% 50%,rgba(0,0,0,0.35) 0%,rgba(0,0,0,0) 70%);\n}\n.mev-track {\n  position: relative;\n  z-index: 1;\n  height: 100%;\n  width: 3rem;\n  background: rgba(0,0,0,0.45);\n}\n/* The garage dash grid, ROTATED: 0deg (\"to top\") puts the first stop at the track's BOTTOM edge and\n   runs the period ALONG the axis, carried by the gradient's own rem stops. `background-size: 100%\n   3rem` is the TRANSPOSED form of the horizontal bar's `3rem 100%` x-period tiling: this sheet used\n   to drop background-size entirely instead of transposing it, which rasterized the gradient across\n   the whole element and smeared each dash's ink over ~4 device px instead of a crisp 2 -- tiling\n   from a 3rem tile fixes that. The period is still a Y-length the root font already scales via\n   SIZE_F, which is why the .mp-lg block below declares no twin for this rule. The gap stripe is\n   opaque as emitted (see the header): the garage look this clones is a MASK over the solid fill.\n   The RING keeps 0.5 -- a separate knob, outside the fill, matching the garage's. */\n.mev-track::after {\n  content: \"\";\n  position: absolute; left: 0; top: 0; width: 100%; height: 100%;\n  z-index: 1;\n  background-image: repeating-linear-gradient(0deg,rgba(236,230,218,0.16) 0rem,rgba(236,230,218,0.16) 2rem,rgba(13,14,16,1) 2rem,rgba(13,14,16,1) 3rem);\n  background-size: 100% 3rem;\n  box-shadow: 0 0 0 1rem rgba(13,14,16,0.5);\n}\n/* THE AXIS: fill grows HEIGHT from bottom:0 (mask-not-overlay idiom unchanged). */\n.mev-fill {\n  position: absolute;\n  left: 0;\n  bottom: 0;\n  width: 100%;\n  height: 0;\n  background: rgba(237,230,217,0.8);\n  transition: height 400ms cubic-bezier(.2,.8,.2,1);\n}\n/* Ticks always cross the track: bottom:<pct%> + translateY(50%) (bottom-anchored centring --\n   the sign is +50%, not the horizontal sibling's -50%, because a bottom-anchored box must\n   shift itself back DOWN by half its own length to land on that point). */\n.mev-tick { position: absolute; left: 50%; height: 2rem; z-index: 2;\n            transform: translate(-50%, 50%); }\n.mev-tick.mev-req { width: 9rem; background: rgba(237,230,217,0.8);\n                    transform: translate(-50%, 50%) translateX(0rem); }\n.mev-tick.mev-req.met { background: rgba(237,230,217,0.8); }\n.mev-tick.mev-cur {\n  width: 9rem;\n  height: 2rem;\n  background: rgba(255,255,255,1);\n  transform: translate(-50%, 50%) translateX(0rem);\n  transition: bottom 400ms cubic-bezier(.2,.8,.2,1);\n}\n.mev-tick.r1 { bottom: 25%; }\n.mev-tick.r2 { bottom: 50%; }\n.mev-tick.r3 { bottom: 75%; }\n.mev-tick.r4 { bottom: 100%; }\n/* ONE SHARED RIGHT-ALIGNMENT LINE FOR EVERY CAPTION (the fix -- see the file header's own\n   bug-fix note): right:100% of #moe-bar-root + translateX(--lfclear) is a FIXED point, never\n   dependent on any caption's own content width, so a numeral's digit count can only grow the\n   box LEFTWARD and can never move an icon, a delta, or any other caption. r1-r3, r4 and the\n   current caption all share it. Icon and delta are IN-FLOW flex children (was: out-of-flow\n   absolute+transform hanging off the box's own edge, which a self-referencing -50% on r4/the\n   current caption used to drag along with it -- see gen_bar_tuner_vertical.ps1's .mpv-cap /\n   the shipped MoEProgress.css's .mp-cap for the same idiom this adopts).\n   DO NOT \"OPTICALLY CENTRE\" the r4 / current captions over the track: that needs a WIDTH-SCALED\n   term, i.e. the digit-count bug returning. A non-zero residual nudge (capxR4 / capxCur below) is\n   legitimate per-group geometry; a nudge computed off the box's own size is the defect. */\n.mev-cap {\n  position: absolute; display: flex; flex-direction: row; align-items: center;\n  white-space: nowrap; z-index: 3; right: 100%;\n}\n/* r1/r2/r3: each bottom-anchored on its OWN tick (25/50/75%) via bottom:<pct%> +\n   translateY(50%) -- the vertical analogue of a caption riding beside its tick. --lfclear\n   clears the WIDER tick's outer edge (crossPad(), == domain/constants.MM_TICK_OVERHANG on the\n   Python side); --capxreq is a small residual TRIM, r1-r3 ONLY (split from r4's --capxr4, own knob\n   -- see the file header's own note on why they legitimately differ). */\n.mev-cap.lf {\n  transform: translateY(50%) translateX(-3rem) translateX(-2rem);\n  font-size: 12rem;\n  line-height: 15.5rem;\n}\n.mev-cap.lf.r1 { transform: translateY(50%) translateX(-2.000rem); }\n.mev-cap.lf.r2 { transform: translateY(50%) translateX(-4.000rem); }\n.mev-cap.lf.r3 { transform: translateY(50%) translateX(-6.000rem); }\n.mev-cap.r1 { bottom: 25%; }\n.mev-cap.r2 { bottom: 50%; }\n.mev-cap.r3 { bottom: 75%; }\n/* r4: the 100% tick's caption, a static cap ABOVE the track's top end -- reads as the axis's\n   top end cap. padding-bottom, not margin-bottom: Coherent drops margin on the bottom:100%-\n   anchored side (gameface-drops-margin-on-the-anchored-side). --capxr4 is r4's OWN residual:\n   r4 sits above the track's END, not beside a tick, so it needs a DIFFERENT constant push than\n   r1-r3's --capxreq to land back over the track -- still a fixed constant, never a function of\n   the numeral's own width. */\n.mev-cap.tp {\n  bottom: 100%; padding-bottom: 4rem;\n  transform: translateX(-3rem) translateX(11rem);\n  font-size: 12rem;\n  line-height: 15.5rem;\n}\n/* THE CURRENT/LATEST VALUE CAPTION -- a STATIC readout below the track's bottom end. There is\n   no moving marker element; only the CURRENT TICK (above) still tracks the fill, which is why\n   MoEEfficiency.js's capClampPct corridor is horizontal-only and is skipped entirely here.\n   top:100% is the one side Coherent's margin drop does NOT apply to (see r4 above), so margin-top\n   here is fine as written. */\n.mev-cap.bt {\n  top: 100%; margin-top: 3rem;\n  transform: translateX(-3rem) translateX(13rem);\n  font-size: 16rem;\n  line-height: 20.5rem;\n}\n.mev-cap .mev-v {\n  position: relative;\n  color: #ffffff;\n  font-weight: 600;\n  letter-spacing: 0em;\n  text-shadow: 0 0 1rem rgba(0,0,0,0.5);\n}\n.mev-cap.lf .mev-v, .mev-cap.tp .mev-v { transform: translateY(0rem); }\n.mev-cap.bt .mev-v { transform: translateY(0rem); }\n/* Every caption's icon/numeral(/delta) mini-row runs HORIZONTALLY, same axis as the horizontal\n   sibling's row, with the ORDER REVERSED: numeral comes BEFORE its icon (the icon trails,\n   away from the track), and on the current caption the delta sits LEFT of the numeral (was\n   right). The icon is now an IN-FLOW flex child: align-items:center centres it, margin-left\n   carries the gap (an ordinary in-flow margin, not the anchored-side one Coherent drops), and\n   the per-role Y nudge is its own small residual transform. */\n.mev-ico { position: relative; display: block; flex: none;\n  width: 13rem;\n  height: 13rem;\n}\n.mev-cap .mev-ico { margin-left: 1rem; }\n/* PER-ICON INK-GAP PARITY (maintainer's ask, box sizes untouched): IDENTICAL literals to the\n   horizontal sibling's .mp-ico.bm/.mp-ico.mk overrides -- same boxes, same assets, the axis\n   rotation changes nothing about the ink. Calibrated off the real PNGs' alpha>32 bbox to a flat\n   3.000rem target (dmg, untouched, naturally lands ~3.006rem); mk is calibrated to mark_2 alone,\n   mark_1/mark_3 land off it by +-2rem -- an accepted residual, same class as MoEProgress.css's\n   own mark correction. Literal, not slider-driven. */\n.mev-cap .mev-ico.bm { margin-left: 1.253rem; }\n.mev-cap .mev-ico.mk { margin-left: -1rem; }\n.mev-cap .mev-ico.mk2 { margin-left: 0.500rem; }\n.mev-cap .mev-ico.mk3 { margin-left: 3.000rem; }\n.mev-cap.lf .mev-ico { transform: translateY(1rem); }\n.mev-cap.tp .mev-ico { transform: translateY(-0.25rem); }\n.mev-cap.bt .mev-ico { transform: translateY(0.5rem); }\n.mev-ico::before {\n  content: \"\";\n  position: absolute;\n  left: 50%;\n  top: 50%;\n  z-index: -1;\n  width: 106%;\n  height: 106%;\n  transform: translate(-50%, -50%);\n  background: radial-gradient(circle at 50% 50%, rgba(255,205,90,0.5) 0%, transparent 73%);\n}\n.mev-cap.lf .mev-ico::before, .mev-cap.tp .mev-ico::before {\n  background: radial-gradient(circle at 50% 50%, rgba(26,26,26,0.5) 0%, transparent 73%);\n}\n#moe-bar-root.mev-b-w .mev-cap.bt .mev-ico::before { background: radial-gradient(circle at 50% 50%, rgba(237,230,217,0.3) 0%, transparent 73%); }\n#moe-bar-root.mev-b-g .mev-cap.bt .mev-ico::before { background: radial-gradient(circle at 50% 50%, rgba(123,236,55,0.8) 0%, transparent 73%); }\n#moe-bar-root.mev-b-t .mev-cap.bt .mev-ico::before { background: radial-gradient(circle at 50% 50%, rgba(90,154,211,0.8) 0%, transparent 73%); }\n#moe-bar-root.mev-b-v .mev-cap.bt .mev-ico::before { background: radial-gradient(circle at 50% 50%, rgba(115,23,196,0.8) 0%, transparent 73%); }\n#moe-bar-root.mev-b-au .mev-cap.bt .mev-ico::before { background: radial-gradient(circle at 50% 50%, rgba(255,205,90,0.9) 0%, transparent 73%); }\n.mev-ico::after {\n  content: \"\";\n  position: absolute; left: 0; top: 0; width: 100%; height: 100%;\n  background-repeat: no-repeat;\n  background-position: center;\n}\n.mev-ico.mk { width: 16rem; height: 16rem; }\n.mev-ico.mk::after { background-size: contain; filter: brightness(1); }\n.mev-ico.mk1::after { background-image: url(img://gui/maps/icons/library/marksOnGun/mark_1.png); }\n.mev-ico.mk2::after { background-image: url(img://gui/maps/icons/library/marksOnGun/mark_2.png); }\n.mev-ico.mk3::after { background-image: url(img://gui/maps/icons/library/marksOnGun/mark_3.png); }\n.mev-ico.bm { width: 14rem; height: 14rem; }\n.mev-ico.bm::after {\n  background-image: url(img://gui/maps/icons/personal_missions_30/quest_type/128x128/icon_battle_condition_barrel_mark.png);\n  background-size: 228.7%;\n  filter: brightness(3);\n}\n.mev-ico.dmg { width: 16rem; height: 16rem; }\n.mev-ico.dmg::after {\n  background-image: url(img://gui/maps/icons/personal_missions_30/quest_type/128x128/icon_battle_condition_damage.png);\n  background-size: 342.5%;\n  filter: brightness(3);\n}\n/* The delta hangs LEFT of the numeral now (was right of it): right:100% + one translate()\n   carrying the gap and the residual Y nudge, ,90,0.9),0 0 2rem rgba(255,205,90,0.9); }\n\n@keyframes mev-life{\n  0%{opacity:0;transform:translateY(20rem);animation-timing-function:ease-in}\n  9.68%{opacity:1;transform:translateY(0rem);animation-timing-function:linear}\n  90.32%{opacity:1;transform:translateY(0rem);animation-timing-function:ease-in}\n  100%{opacity:0;transform:translateY(20rem)}}\n#moe-bar-root.mev-run{animation:mev-life 6200ms both}\n/* THE RE-TRIGGER TWIN -- byte-identical to mev-life apart from the name (one builder emits\n   both). A baked fade/hold/fade keyframe cannot be re-triggered in place: the JS restart is\n   remove-class -> force-reflow -> re-add-class, and if Coherent coalesces the re-add with\n   the run it just cancelled the restart is a NO-OP -- which, with the root resting at\n   opacity 0 under `both` fill, leaves the bar permanently INVISIBLE after its first\n   appearance. So the JS ALTERNATES .mev-run / .mev-run-b (MoEBarTransient.js\n   RUN_CLASSES_V/RUN_NAMES_V): consecutive runs carry names the engine cannot coalesce.\n   Without the pair this bar cannot re-raise for a second battle event. */\n@keyframes mev-life-b{\n  0%{opacity:0;transform:translateY(20rem);animation-timing-function:ease-in}\n  9.68%{opacity:1;transform:translateY(0rem);animation-timing-function:linear}\n  90.32%{opacity:1;transform:translateY(0rem);animation-timing-function:ease-in}\n  100%{opacity:0;transform:translateY(20rem)}}\n#moe-bar-root.mev-run-b{animation:mev-life-b 6200ms both}\n@keyframes mev-pulse{\n  0%,100%{box-shadow:0 0 8rem rgba(255,205,90,0.9)}\n  50%{box-shadow:0 0 16rem rgba(255,205,90,1.00)}}\n#moe-bar-root.mev-b-au.mev-pulse .mev-track{animation:mev-pulse 1200ms ease-in-out infinite}\n\n/* ===== THE \"LARGE\" SIZE MODE (mod_settings.progress_bar_size == 1). The mode is delivered by\n   the ROOT FONT SIZE (MoEBarTransient.js SIZE_F == 1.25), which IS the rem->px factor in\n   Gameface, so that one write re-lays the whole composition 1.25x and correctly leaves every %,\n   em, gradient stop and derived background-size ratio alone. What is left is the CROSS-AXIS\n   (screen-x) lengths, which must reach 5/3 total and therefore owe SIZE_XF == 4/3 ALONE on top\n   of it -- so every declaration below is an x-length and nothing else. Do NOT add a font-size, a\n   bar length, a tick thickness, an icon box, a vertical gap or a keyframe here: the root font\n   already has them and restating one would DOUBLE-APPLY SIZE_F.\n   HAND-EDIT 4/5: the tuner emits this block under `.mev-lg`; the class MoEBarTransient.applySize\n   actually writes on the body is `.mp-lg`, shared by both orientations (the SIZE flag is\n   orientation-independent), so every selector below is rewritten to it. Do not \"restore\" .mev-lg\n   -- nothing would ever match it.\n   THE DASH GRID TAKES NO RULE HERE, deliberately: a 0deg grid's period is a y-length the root font\n   already scales, so a reintroduced twin would double-apply SIZE_F. check_eff_vertical.js carries a\n   NAMED ABSENCE assertion for exactly that, because a value-equality gate has no other way to\n   notice the horizontal bar's twin creeping back in. */\n/* HAND-EDIT 5/5: the emit's `.mev-lg #mev-bar-root` plus the shim rule the tuner never emits, both\n   scoped `body.mev.mp-lg` (1,2,1) so they out-specify the horizontal sheet's own\n   `.mp-lg #moe-bar-root` / `.mp-lg #moe-bar-box` (1,1,0) outright. The shim's width is\n   V_BOX_W_REM*SIZE_XF + 2*PAD_REM == 128 + 20; its HEIGHT is unchanged (the root font carries\n   SIZE_F on a y-length), exactly as the horizontal block's own twin restates width only. */\nbody.mev.mp-lg #moe-bar-root { width: 4rem; }\nbody.mev.mp-lg #moe-bar-box { width: 148rem; }\n.mp-lg .mev-track { width: 4rem; }\n.mp-lg .mev-backdrop { left: -53.333rem; width: 128rem; }\n.mp-lg .mev-tick.mev-req { width: 12rem;\n  transform: translate(-50%, 50%) translateX(0rem); }\n.mp-lg .mev-tick.mev-cur { width: 12rem;\n  transform: translate(-50%, 50%) translateX(0rem); }\n.mp-lg .mev-cap.lf { transform: translateY(50%) translateX(-4rem) translateX(-2.667rem); }\n.mp-lg .mev-cap.lf.r1 { transform: translateY(50%) translateX(-3.000rem); }\n.mp-lg .mev-cap.lf.r2 { transform: translateY(50%) translateX(-5.000rem); }\n.mp-lg .mev-cap.lf.r3 { transform: translateY(50%) translateX(-7.000rem); }\n.mp-lg .mev-cap.tp { transform: translateX(-4rem) translateX(14.667rem); }\n.mp-lg .mev-cap.bt { transform: translateX(-4rem) translateX(17.333rem); }\n.mp-lg .mev-cap .mev-ico { margin-left: 1.333rem; }\n/* The Large twins of the per-icon ink-gap-parity overrides above: literal, SIZE_XF (4/3)\n   applied by hand to the Default literal, never re-derived from the shared margin-left knob. */\n.mp-lg .mev-cap .mev-ico.bm { margin-left: 1.671rem; }\n.mp-lg .mev-cap .mev-ico.mk { margin-left: -1.333rem; }\n.mp-lg .mev-cap .mev-ico.mk1 { margin-left: -1.000rem; }\n.mp-lg .mev-cap .mev-ico.mk2 { margin-left: 1.000rem; }\n.mp-lg .mev-cap .mev-ico.mk3 { margin-left: 3.000rem; }\n.mp-lg .mev-cap.bt .mev-d { transform: translate(-5.6rem, 2.5rem); }\n\n/* Axis + timings for the JS (mirrored in MoEBarTransient.js / MoEEfficiency.js -- the VERTICAL\n   keyframes are identically tuned to the horizontal ones, which is why one set of timing constants\n   serves both orientations). The tuner's trailing `minimap` placement block is deliberately NOT\n   carried over: those numbers are the PYTHON side's (domain/constants MINIMAP_SIZES, MM_GAP,\n   MM_GAP_BOTTOM, MM_TICK_OVERHANG) and a second copy here would be drift waiting to happen.\n{\n  \"axis\": \"damage, five stops -> four equal quarters, BOTTOM(0%) to TOP(100%) (barX, same as the horizontal sibling)\",\n  \"dmgStopsSource\": \"snapshot.thresholds{1,2,3,100}\",\n  \"barStops\": [0, 25, 50, 75, 100],\n  \"fadeInMs\": 600,\n  \"holdMs\": 5000,\n  \"fadeOutMs\": 600,\n  \"totalMs\": 6200,\n  \"slideRem\": 20,\n  \"slideEasingIn\": \"ease-in\",\n  \"slideEasingOut\": \"ease-in\",\n  \"fillDurationMs\": 400,\n  \"fillEasing\": \"cubic-bezier(.
